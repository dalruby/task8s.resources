apiVersion: v1alpha1
name: 'CKS (Hands-On): RBAC and ServiceAccounts'
k8sVersion: 1.34.0
timing:
  enabled: true
  limitSeconds: 7200
introduction:
  elements:
  - type: context
    text: |
      Hands-on practice for **RBAC** and **ServiceAccounts**, the CKS tools for restricting access to the Kubernetes API and for limiting
      what a compromised workload can do. There is no multiple choice: you read roles and bindings, write them, check effective
      permissions and fix over-broad access.

      **Lab environment**

      - You are `root` on the control-plane node of a kubeadm cluster (Kubernetes 1.34, containerd). `kubectl` works with the admin
        credentials, so `--as` impersonation is available.
      - The scenarios use a few namespaces (`dev`, `prod`, `ci`, `shop`, `finance`, `monitoring`); each scenario says which objects exist.
      - Test users such as `jane` or `kim` are authenticated by client certificates; ServiceAccounts are the in-cluster identities.

      **How answers are checked**

      - *Manifests* (Roles, bindings, ServiceAccounts) are validated against the Kubernetes schema, and then for what they *mean*:
        API groups, resources, verbs, subjects and scope. Names of unrelated fields and the order of rules do not matter.
      - *Commands* are checked structurally: flags may come in any order, long and short forms are accepted, and values such as
        `--verb=get,list` may be written in any order.
      - *Short answers* accept the common spellings. Question text states what is wanted, not which fields to use.

      Exam content is under NDA: this is practice for the common patterns, not a prediction.
  - type: references
    links:
    - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
      text: Using RBAC Authorization
    - url: https://kubernetes.io/docs/concepts/security/service-accounts/
      text: Service Accounts
    - url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
      text: Configure Service Accounts for Pods
    - url: https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/
      text: Managing Service Accounts
    - url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_auth/kubectl_auth_can-i/
      text: kubectl auth can-i
    - url: https://training.linuxfoundation.org/certification/certified-kubernetes-security-specialist-cks/
      text: CKS Domains and Competencies
manifestDefinitions:
- id: role-v1
  kind: Role
  apiVersion: rbac.authorization.k8s.io/v1
  autoLoad: true
- id: rolebinding-v1
  kind: RoleBinding
  apiVersion: rbac.authorization.k8s.io/v1
  autoLoad: true
- id: clusterrole-v1
  kind: ClusterRole
  apiVersion: rbac.authorization.k8s.io/v1
  autoLoad: true
- id: serviceaccount-v1
  kind: ServiceAccount
  apiVersion: v1
  autoLoad: true
scenarios:
- title: The Four RBAC Objects
  category: How RBAC Works
  hintsEnabled: true
  elements:
  - type: context
    text: |
      RBAC is built from four objects. Two of them say **what is allowed**, two say **who gets it**:

      | | Namespaced | Cluster-wide |
      |---|---|---|
      | **What** (rules) | `Role` | `ClusterRole` |
      | **Who** (subjects) | `RoleBinding` | `ClusterRoleBinding` |

      A team asks for read access to the cluster's **Nodes**.
  - type: question
    question:
      questionType: single-line
      header: 'Which object type must carry the rule: `Role` or `ClusterRole`?'
      hint: Are Nodes namespaced?
      correctAnswerInfo: Nodes are cluster-scoped, so only a `ClusterRole` can grant access to them. A `Role` lives in one
        namespace and can only grant access to namespaced resources in that namespace.
      expectedAnswer: ClusterRole
      cel: answer.trim().lowerAscii() in ['clusterrole']
  - type: question
    question:
      questionType: command
      header: List every resource type that is **not** namespaced.
      hint: '`kubectl api-resources` has a filter on scope.'
      correctAnswerInfo: '`kubectl api-resources --namespaced=false` shows cluster-scoped types such as `nodes`, `namespaces`,
        `persistentvolumes` and `clusterroles`. These can only be granted through a ClusterRole.'
      command:
        executable: kubectl
        subcommands:
        - name: api-resources
        flags:
        - name: namespaced
          required: true
          value: 'false'
  - type: question
    question:
      questionType: single-line
      header: Which object type hands the permissions of a `ClusterRole` to a user **only inside one namespace**?
      hint: The "who" objects come in two scopes.
      correctAnswerInfo: A `RoleBinding` can reference a `ClusterRole`. The permissions then apply only in the RoleBinding's
        own namespace. This is how the built-in `view`, `edit` and `admin` roles are reused per namespace.
      expectedAnswer: RoleBinding
      cel: answer.trim().lowerAscii() in ['rolebinding', 'a rolebinding']
  explanation:
    elements:
    - type: context
      text: |
        - A `Role`/`ClusterRole` is only a list of rules; it grants nothing until a binding connects it to subjects.
        - A `ClusterRole` can be used in two ways: bound with a `ClusterRoleBinding` (everywhere) or with a `RoleBinding` (one namespace).
        - Cluster-scoped resources (nodes, namespaces, persistentvolumes, storageclasses, CSRs, ...) can **only** be granted through a ClusterRole *and* a ClusterRoleBinding.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: apiGroups, Plural Names and Core
  category: How RBAC Works
  hintsEnabled: true
  elements:
  - type: context
    text: |
      Every rule has `apiGroups`, `resources` and `verbs`. The group of a resource is the part of its `apiVersion`
      before the slash. This is the relevant part of `kubectl api-resources`:
  - type: table
    style: terminal
    columns:
    - NAME
    - SHORTNAMES
    - APIVERSION
    - NAMESPACED
    - KIND
    rows:
    - - configmaps
      - cm
      - v1
      - 'true'
      - ConfigMap
    - - secrets
      - ''
      - v1
      - 'true'
      - Secret
    - - serviceaccounts
      - sa
      - v1
      - 'true'
      - ServiceAccount
    - - deployments
      - deploy
      - apps/v1
      - 'true'
      - Deployment
    - - jobs
      - ''
      - batch/v1
      - 'true'
      - Job
    - - networkpolicies
      - netpol
      - networking.k8s.io/v1
      - 'true'
      - NetworkPolicy
    - - roles
      - ''
      - rbac.authorization.k8s.io/v1
      - 'true'
      - Role
  - type: question
    question:
      questionType: single-line
      header: Which `apiGroups` value does a rule for **Deployments** need?
      hint: Look at the APIVERSION column.
      expectedAnswer: apps
      cel: answer.trim().lowerAscii() in ['apps']
  - type: question
    question:
      questionType: single-line
      header: Which `apiGroups` value does a rule for **NetworkPolicies** need?
      hint: Drop the version, keep the group.
      expectedAnswer: networking.k8s.io
      cel: answer.trim().lowerAscii() in ['networking.k8s.io']
  - type: question
    question:
      questionType: single-line
      header: How is the **core** group written in `apiGroups` (the group of Secrets and ConfigMaps)?
      hint: The core group has no name.
      correctAnswerInfo: 'Core resources have `apiVersion: v1` with no group, and RBAC writes that empty group as an empty
        string: `apiGroups: [""]`.'
      expectedAnswer: '""'
      cel: answer.trim().lowerAscii() in ['""', "''", '[""]', "['']", '[ "" ]', '- ""']
  - type: question
    question:
      questionType: single-line
      header: 'A rule lists `resources: ["secret"]`. Does it match Secrets? (yes/no)'
      hint: Compare with the NAME column.
      correctAnswerInfo: Rules use the plural resource name exactly as the API serves it. `kubectl create role` accepts singular
        and short names and translates them, but a hand-written manifest does not.
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  explanation:
    elements:
    - type: context
      text: |
        A rule matches only if **all three** of apiGroups, resources and verbs match. The common groups:

        | Group | Resources (examples) |
        |---|---|
        | `""` (core) | pods, services, secrets, configmaps, serviceaccounts, nodes, namespaces, persistentvolumes |
        | `apps` | deployments, statefulsets, daemonsets, replicasets |
        | `batch` | jobs, cronjobs |
        | `networking.k8s.io` | networkpolicies, ingresses |
        | `rbac.authorization.k8s.io` | roles, rolebindings, clusterroles, clusterrolebindings |
        | `certificates.k8s.io` | certificatesigningrequests |

        `kubectl api-resources -o wide` shows groups and the supported verbs of every resource. `kubectl explain` gives the schema.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
      - url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_api-resources/
        text: kubectl api-resources
- title: Verbs and the list Trap
  category: How RBAC Works
  hintsEnabled: true
  elements:
  - type: context
    text: |
      The verbs map to API operations: `get` (one object), `list` (a collection), `watch` (stream of changes),
      `create`, `update`, `patch`, `delete` and `deletecollection`.

      This Role was created in `prod` for an auditing tool that "only lists, never reads, Secrets":
  - type: manifest
    content: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: secret-lister
        namespace: prod
      rules:
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["list"]
  - type: question
    question:
      questionType: single-line
      header: Can the tool read the **values** stored in the Secrets of `prod`? (yes/no)
      hint: What does a list response contain for each item?
      correctAnswerInfo: A `list` call returns every full object, including `data`. `kubectl get secrets -n prod -o yaml`
        is a list request.
      expectedAnswer: 'yes'
      cel: answer.trim().lowerAscii() in ['yes']
  - type: question
    question:
      questionType: single-line
      header: Name the two verbs, besides `get`, that expose Secret contents.
      hint: One returns collections, the other streams them.
      correctAnswerInfo: '`watch` streams full objects as they change, so it also reveals values. Treat `get`, `list` and
        `watch` on Secrets as the same level of exposure.'
      expectedAnswer: list, watch
      cel: answer.trim().lowerAscii() in ['list, watch', 'list,watch', 'watch, list', 'watch,list', 'list and watch', 'watch
        and list', 'list watch', 'watch list']
  - type: question
    question:
      questionType: single-line
      header: Does `kubectl get secret db-pass -n prod` succeed with this Role? (yes/no)
      hint: Which verb is a request for one named object?
      correctAnswerInfo: Fetching a single named object is `get`, a separate verb. The tool can still read `db-pass` through
        the list, which is why granting `list` alone is no protection.
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  explanation:
    elements:
    - type: context
      text: |
        | Verb | HTTP | Note |
        |---|---|---|
        | `get` | GET one | needs the object name |
        | `list` | GET collection | returns **all** objects, with full content |
        | `watch` | GET `?watch=true` | streams objects as they change |
        | `create` | POST | |
        | `update` / `patch` | PUT / PATCH | |
        | `delete` / `deletecollection` | DELETE | |

        For Secrets, `get`, `list` and `watch` are all "can read the secret data". Restrict them with `resourceNames` where possible.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: Subresources Are Separate Resources
  category: How RBAC Works
  hintsEnabled: true
  elements:
  - type: context
    text: |
      Some operations act on a **subresource** such as `pods/log` or `pods/exec`. A rule for `pods` does not cover
      its subresources. This Role is bound to the user `kim` in `dev`:
  - type: manifest
    content: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: pod-viewer
        namespace: dev
      rules:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list", "watch"]
  - type: question
    question:
      questionType: single-line
      header: Can `kim` run `kubectl logs web-0 -n dev`? (yes/no)
      hint: Logs are served from a path below the Pod.
      correctAnswerInfo: Logs are read from the `log` subresource, so the rule needs `pods/log` with `get`.
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  - type: question
    question:
      questionType: single-line
      header: Which `resources` entry would allow reading logs?
      hint: Resource, slash, subresource.
      expectedAnswer: pods/log
      cel: answer.trim().lowerAscii() in ['pods/log']
  - type: question
    question:
      questionType: single-line
      header: Which `resources` entry does `kubectl scale deployment` need, in addition to `deployments` for reading?
      hint: The scale operation has its own subresource.
      correctAnswerInfo: '`deployments/scale` (verbs `get`, `update` or `patch`) lets a user change replicas without being
        able to edit the rest of the Deployment.'
      expectedAnswer: deployments/scale
      cel: answer.trim().lowerAscii() in ['deployments/scale']
  - type: question
    question:
      questionType: single-line
      header: Which subresource of Pods grants a shell inside a container (`kubectl exec`)?
      hint: Same pattern again.
      correctAnswerInfo: '`pods/exec` is one of the most sensitive grants in a namespace; so are `pods/attach` and `pods/portforward`.
        Documentation pairs it with `create`, but since kubectl uses WebSockets (1.31) an exec request arrives as a GET, and
        on 1.34 `get` on `pods/exec` is enough to authorise `kubectl exec` (1.35 tightens this behind a feature gate). Treat
        any verb on `pods/exec` as a finding.'
      expectedAnswer: pods/exec
      cel: answer.trim().lowerAscii() in ['pods/exec']
  explanation:
    elements:
    - type: context
      text: |
        Common subresources worth knowing: `pods/log`, `pods/exec`, `pods/attach`, `pods/portforward`, `pods/eviction`,
        `deployments/scale`, `nodes/proxy`, `serviceaccounts/token`, `certificatesigningrequests/approval`.

        Listing `pods` never implies `pods/exec`. Writing `resources: ["*"]` does, which is one reason wildcards are a finding in a review.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: RBAC Is Purely Additive
  category: How RBAC Works
  hintsEnabled: true
  elements:
  - type: context
    text: |
      RBAC has **no deny rules**. A request is allowed if *any* rule from *any* binding that applies to the caller
      allows it. The user `lee` in namespace `dev` has two bindings:
  - type: table
    style: terminal
    columns:
    - NAMESPACE
    - NAME
    - ROLE
    - AGE
    - USERS
    - GROUPS
    - SERVICEACCOUNTS
    rows:
    - - dev
      - lee-view
      - ClusterRole/view
      - 30d
      - lee
      - ''
      - ''
    - - dev
      - lee-edit
      - ClusterRole/edit
      - 2d
      - lee
      - ''
      - ''
  - type: question
    question:
      questionType: single-line
      header: Can `lee` delete Deployments in `dev`? (yes/no)
      hint: '`view` does not allow it. What about the other binding?'
      correctAnswerInfo: '`view` is read-only, but `edit` also allows deletes. The union of both applies.'
      expectedAnswer: 'yes'
      cel: answer.trim().lowerAscii() in ['yes']
  - type: question
    question:
      questionType: single-line
      header: To stop `lee` deleting Deployments, can you create a Role that lists only read verbs and bind it to `lee`? (yes/no)
      hint: Does a new grant ever remove an old one?
      correctAnswerInfo: Adding a narrower Role changes nothing. The only way to take permissions away is to remove or narrow
        the bindings (or roles) that grant them.
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  - type: question
    question:
      questionType: command
      header: Remove the permission by deleting the binding `lee-edit` in namespace `dev`.
      hint: '`kubectl delete` takes the type and the name.'
      command:
        executable: kubectl
        subcommands:
        - name: delete
        - name: rolebinding
          aliases:
          - rolebindings
        positionals:
        - index: 0
          value: lee-edit
          description: binding name
        flags:
        - name: namespace
          short: n
          required: true
          value: dev
  explanation:
    elements:
    - type: context
      text: |
        Because RBAC only adds, auditing means looking at **every** binding for a subject, including those through groups.
        To revoke access: delete the binding, remove the subject from it, or narrow the Role it points to.
        There is no way to express "everything except".
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: nonResourceURLs Need a ClusterRole
  category: How RBAC Works
  hintsEnabled: true
  elements:
  - type: context
    text: |
      Some API server endpoints are not Kubernetes resources: `/healthz`, `/livez`, `/readyz`, `/metrics`, `/version`.
      Rules reach them through `nonResourceURLs` instead of `resources`, and only the HTTP verbs `get`, `post`, ... apply.
  - type: question
    question:
      questionType: single-line
      header: Can a namespaced `Role` contain `nonResourceURLs`? (yes/no)
      hint: These URLs do not belong to any namespace.
      correctAnswerInfo: '`nonResourceURLs` are cluster-wide by nature, so they are only allowed in a `ClusterRole` (and must
        be bound with a `ClusterRoleBinding`).'
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  - type: question
    question:
      questionType: manifest
      header: Write a ClusterRole named `metrics-reader` that allows `get` on the endpoints `/healthz` and `/metrics`.
      hint: The key is camel-cased and its value is a list of paths.
      manifestDefinitionId: clusterrole-v1
      initialContent: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: metrics-reader
        rules:
      expectedFields:
      - path: metadata.name
        expectedValue: metrics-reader
      cel:
      - name: Non-resource URLs
        expression: manifest.rules.exists(r, has(r.nonResourceURLs) && '/healthz' in r.nonResourceURLs && '/metrics' in r.nonResourceURLs)
        message: Both endpoints must be named in a rule
      - name: Read-only
        expression: manifest.rules.exists(r, has(r.nonResourceURLs) && r.verbs == ['get'])
        message: The rule must allow reading only
  explanation:
    elements:
    - type: context
      text: |
        The built-in `system:public-info-viewer` ClusterRole is the classic example: it allows `get` on `/healthz`, `/livez`,
        `/readyz`, `/version` and is bound to both authenticated and unauthenticated users by default.
        A `nonResourceURLs` entry may end in `*` to match a prefix, for example `/metrics*`.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: The Binding Matrix
  category: Binding Scope
  hintsEnabled: true
  elements:
  - type: context
    text: |
      The role type and the binding type **together** decide where a permission applies. Two ClusterRoles exist:
      `pod-reader` (get, list, watch on Pods) and `node-reader` (get, list, watch on Nodes). A third, namespaced `Role`
      named `pod-reader` also exists in `dev`. These bindings exist:
  - type: table
    style: terminal
    columns:
    - BINDING
    - KIND
    - NAMESPACE
    - ROLEREF
    - SUBJECT
    rows:
    - - b-ann
      - RoleBinding
      - dev
      - Role/pod-reader
      - ann
    - - b-bob
      - RoleBinding
      - dev
      - ClusterRole/pod-reader
      - bob
    - - b-cy
      - ClusterRoleBinding
      - '-'
      - ClusterRole/pod-reader
      - cy
    - - b-dee
      - ClusterRoleBinding
      - '-'
      - ClusterRole/node-reader
      - dee
    - - b-eve
      - RoleBinding
      - dev
      - ClusterRole/node-reader
      - eve
  - type: question
    question:
      questionType: single-line
      header: Can `ann` list Pods in namespace `prod`? (yes/no)
      hint: A RoleBinding works in its own namespace.
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  - type: question
    question:
      questionType: single-line
      header: Can `bob` list Pods in namespace `dev`? (yes/no)
      hint: A ClusterRole bound by a RoleBinding is limited to that namespace, not removed.
      expectedAnswer: 'yes'
      cel: answer.trim().lowerAscii() in ['yes']
  - type: question
    question:
      questionType: single-line
      header: Can `bob` list Pods in namespace `prod`? (yes/no)
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  - type: question
    question:
      questionType: single-line
      header: Can `cy` list Pods in namespace `prod`? (yes/no)
      hint: Which binding kind has no namespace?
      expectedAnswer: 'yes'
      cel: answer.trim().lowerAscii() in ['yes']
  - type: question
    question:
      questionType: single-line
      header: Can `eve` list Nodes? (yes/no)
      hint: Which kind of binding can grant cluster-scoped resources?
      correctAnswerInfo: Nodes are not namespaced, so there is no "namespace dev" in which the permission could apply. A RoleBinding
        never grants cluster-scoped resources, even when it points to a ClusterRole that lists them.
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  - type: question
    question:
      questionType: single-line
      header: Can `dee` list Nodes? (yes/no)
      expectedAnswer: 'yes'
      cel: answer.trim().lowerAscii() in ['yes']
  explanation:
    elements:
    - type: context
      text: |
        | Binding | Points to | Effect |
        |---|---|---|
        | RoleBinding | Role (same namespace) | rules apply in that namespace |
        | RoleBinding | ClusterRole | rules apply **only in the binding's namespace** (cluster-scoped resources excluded) |
        | ClusterRoleBinding | ClusterRole | rules apply in all namespaces and to cluster-scoped resources |
        | ClusterRoleBinding | Role | **not allowed** |

        Reusing a ClusterRole through RoleBindings is the standard way to hand out `view`, `edit` or `admin` per namespace.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: roleRef Rules
  category: Binding Scope
  hintsEnabled: true
  elements:
  - type: context
    text: |
      A binding's `roleRef` names the role it grants. It has three fields (`apiGroup`, `kind`, `name`).
      A colleague wants to re-point the RoleBinding `team-access` in `dev` from `view` to `edit` and proposes to
      `kubectl edit` the `roleRef.name`.
  - type: question
    question:
      questionType: single-line
      header: Will that edit be accepted? (yes/no)
      hint: Would changing the target silently change the meaning of an existing grant?
      correctAnswerInfo: '`roleRef` is immutable. The binding must be deleted and recreated (`kubectl replace --force` does
        both). Immutability stops someone who may *update* bindings from escalating an existing one without being allowed
        to *create* a new one.'
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  - type: question
    question:
      questionType: single-line
      header: What is the value of `roleRef.apiGroup` for a Role or ClusterRole?
      hint: It is the group of the RBAC objects themselves.
      expectedAnswer: rbac.authorization.k8s.io
      cel: answer.trim().lowerAscii() in ['rbac.authorization.k8s.io']
  - type: question
    question:
      questionType: single-line
      header: Can a RoleBinding in `dev` reference a `Role` that exists only in `prod`? (yes/no)
      hint: A RoleBinding's role is looked up in its own namespace.
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  - type: question
    question:
      questionType: single-line
      header: Can a ClusterRoleBinding reference a namespaced `Role`? (yes/no)
      hint: Which kinds are valid in a ClusterRoleBinding's roleRef?
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  explanation:
    elements:
    - type: context
      text: |
        - `roleRef.kind` is `Role` or `ClusterRole`; a ClusterRoleBinding may only use `ClusterRole`.
        - Subjects of a binding **can** be edited in place; only `roleRef` is fixed.
        - A binding may reference a role that does not exist yet. It simply grants nothing until the role appears.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: Subjects and Cross-Namespace ServiceAccounts
  category: Subjects
  hintsEnabled: true
  elements:
  - type: context
    text: |
      A binding's `subjects` list may contain three kinds. `User` and `Group` are plain names with
      `apiGroup: rbac.authorization.k8s.io`. A `ServiceAccount` is a real object, so its subject needs a `namespace`
      and has the empty core `apiGroup`: it is simply left out.

      The CI system runs as ServiceAccount `builder` in namespace `ci`. It must read (but not change) the objects
      of namespace `dev`.
  - type: question
    question:
      questionType: manifest
      header: Write a RoleBinding named `ci-view` in namespace `dev` that grants the ClusterRole `view` to the ServiceAccount
        `builder` of namespace `ci`.
      hint: The binding lives in the namespace being accessed; the subject names where the account lives.
      correctAnswerInfo: The RoleBinding sits in `dev` (where access is granted), while the subject points to `ci` (where
        the account lives). A ServiceAccount subject must carry its namespace; `apiGroup` stays unset.
      manifestDefinitionId: rolebinding-v1
      initialContent: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: ci-view
          namespace: dev
      expectedFields:
      - path: metadata.name
        expectedValue: ci-view
      - path: metadata.namespace
        expectedValue: dev
      - path: roleRef.kind
        expectedValue: ClusterRole
      - path: roleRef.name
        expectedValue: view
      - path: roleRef.apiGroup
        expectedValue: rbac.authorization.k8s.io
      cel:
      - name: ServiceAccount subject
        expression: manifest.subjects.exists(s, s.kind == 'ServiceAccount' && s.name == 'builder')
        message: The subject must be the builder ServiceAccount
      - name: Namespace of the ServiceAccount
        expression: manifest.subjects.exists(s, s.kind == 'ServiceAccount' && has(s.namespace) && s.namespace == 'ci')
        message: The subject must say which namespace the account lives in
      - name: No foreign apiGroup
        expression: manifest.subjects.all(s, s.kind != 'ServiceAccount' || !has(s.apiGroup) || s.apiGroup == '')
        message: A ServiceAccount subject belongs to the core group
  - type: question
    question:
      questionType: single-line
      header: Which field must a ServiceAccount subject carry that a `User` subject does not need?
      hint: Account names are only unique within one namespace.
      expectedAnswer: namespace
      cel: answer.trim().lowerAscii() in ['namespace']
  explanation:
    elements:
    - type: context
      text: |
        | Subject kind | `apiGroup` | `namespace` |
        |---|---|---|
        | `User` | `rbac.authorization.k8s.io` | not used |
        | `Group` | `rbac.authorization.k8s.io` | not used |
        | `ServiceAccount` | `""` (leave it out) | **required** in a binding |

        Users and groups are not objects: they come from the credentials presented (certificate CN/O, OIDC claims, ...). RBAC never checks that they exist.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: ServiceAccount Identities and Groups
  category: Subjects
  hintsEnabled: true
  elements:
  - type: context
    text: |
      When a ServiceAccount authenticates, the API server derives a user name and a set of groups from it. These are
      what RBAC and audit logs see, and what `--as` impersonates.
  - type: question
    question:
      questionType: single-line
      header: What is the user name of ServiceAccount `builder` in namespace `ci`?
      hint: Prefix, namespace, name, joined by colons. The prefix is singular.
      expectedAnswer: system:serviceaccount:ci:builder
      cel: answer.trim().lowerAscii() in ['system:serviceaccount:ci:builder']
  - type: question
    question:
      questionType: single-line
      header: Which group contains **every** ServiceAccount of namespace `ci`?
      hint: Plural this time.
      expectedAnswer: system:serviceaccounts:ci
      cel: answer.trim().lowerAscii() in ['system:serviceaccounts:ci']
  - type: question
    question:
      questionType: single-line
      header: Which group contains every ServiceAccount in the whole cluster?
      expectedAnswer: system:serviceaccounts
      cel: answer.trim().lowerAscii() in ['system:serviceaccounts']
  - type: question
    question:
      questionType: command
      header: Create a RoleBinding named `ci-view` in namespace `dev` that gives the ClusterRole `view` to **all** ServiceAccounts
        of namespace `ci` using the group.
      hint: Use the group flag, not the service account flag.
      correctAnswerInfo: Binding a group like `system:serviceaccounts:ci` affects every current *and future* ServiceAccount
        in that namespace, which is rarely the least-privilege choice.
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: rolebinding
        positionals:
        - index: 0
          value: ci-view
          description: binding name
        flags:
        - name: clusterrole
          required: true
          value: view
        - name: group
          required: true
          value: system:serviceaccounts:ci
        - name: namespace
          short: n
          required: true
          value: dev
  explanation:
    elements:
    - type: context
      text: |
        A ServiceAccount token carries three identities at once:

        - user: `system:serviceaccount:<namespace>:<name>`
        - groups: `system:serviceaccounts`, `system:serviceaccounts:<namespace>` and `system:authenticated`

        Binding a group is convenient and dangerous: new ServiceAccounts inherit the grant the moment they are created.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
      - url: https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/
        text: Managing Service Accounts
- title: A Typo Grants Nothing
  category: Subjects
  hintsEnabled: true
  elements:
  - type: context
    text: |
      Subject names are **free text**. The API server does not check that a user, group or ServiceAccount exists, nor
      that a name is spelled consistently. The `builder` pipeline in `ci` suddenly cannot read Pods in `dev`
      although a binding was created for it. This is the binding list:
  - type: table
    style: terminal
    columns:
    - NAMESPACE
    - NAME
    - ROLE
    - AGE
    - USERS
    - GROUPS
    - SERVICEACCOUNTS
    rows:
    - - dev
      - ci-view
      - ClusterRole/view
      - 1h
      - ''
      - ''
      - ci/biulder
    - - dev
      - dev-team
      - ClusterRole/edit
      - 40d
      - ''
      - dev-team
      - ''
  - type: question
    question:
      questionType: command
      header: List the ServiceAccounts of namespace `ci` to compare the spelling.
      command:
        executable: kubectl
        subcommands:
        - name: get
        - name: serviceaccounts
          aliases:
          - serviceaccount
          - sa
        flags:
        - name: namespace
          short: n
          required: true
          value: ci
  - type: question
    question:
      questionType: single-line
      header: Did `kubectl apply` of the binding fail when it contained the misspelled name? (yes/no)
      correctAnswerInfo: RBAC does not validate subjects. A misspelled name is a perfectly valid binding that matches nobody.
        Always verify a new binding with `kubectl auth can-i`.
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  - type: question
    question:
      questionType: single-line
      header: Which user name would you impersonate to test the corrected binding?
      hint: The identity the API server sees for a ServiceAccount.
      expectedAnswer: system:serviceaccount:ci:builder
      cel: answer.trim().lowerAscii() in ['system:serviceaccount:ci:builder']
  explanation:
    elements:
    - type: context
      text: |
        Typos and case differences (`Builder` vs `builder`) are the most common reason a "correct" binding does nothing.
        Check the result from the subject's point of view with `kubectl auth can-i ... --as ...` rather than trusting the manifest.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: Create a Role
  category: Imperative Commands
  hintsEnabled: true
  elements:
  - type: context
    text: |
      `kubectl create role` builds a Role without writing YAML. The verbs, resources and optionally the object names it
      may touch are flags. Every task below is in namespace `dev`.
  - type: question
    question:
      questionType: command
      header: Create a Role named `pod-reader` that may `get`, `list` and `watch` Pods.
      hint: Several verbs fit in one flag if you separate them.
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: role
        positionals:
        - index: 0
          value: pod-reader
          description: role name
        flags:
        - name: verb
          required: true
          repeatable: true
        - name: resource
          required: true
          oneOf:
          - pods
          - pod
          - po
        - name: namespace
          short: n
          required: true
          value: dev
      cel:
      - name: Verbs
        expression: '(type(flags.verb) == list ? flags.verb.join('','') : flags.verb).split('','').size() == 3 && [''get'',
          ''list'', ''watch''].all(v, v in (type(flags.verb) == list ? flags.verb.join('','') : flags.verb).split('',''))'
        message: The role must allow reading Pods with exactly the three read verbs
  - type: question
    question:
      questionType: command
      header: Create a Role named `cm-reader` that may only `get` the single ConfigMap `app-config`.
      hint: A third flag narrows a rule to named objects.
      correctAnswerInfo: '`--resource-name` becomes `resourceNames` in the rule. It restricts `get`, `update`, `patch` and
        `delete` to that object. It cannot restrict `create` or `deletecollection`; `list` and `watch` are only restricted
        for requests that select that one name (a `metadata.name` field selector), so in practice grant `get` instead.'
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: role
        positionals:
        - index: 0
          value: cm-reader
          description: role name
        flags:
        - name: verb
          required: true
          value: get
        - name: resource
          required: true
          oneOf:
          - configmaps
          - configmap
          - cm
        - name: resource-name
          required: true
          value: app-config
        - name: namespace
          short: n
          required: true
          value: dev
  - type: question
    question:
      questionType: command
      header: Create a Role named `log-reader` that may `get` the logs of Pods (the log subresource).
      hint: Subresources are written with a slash.
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: role
        positionals:
        - index: 0
          value: log-reader
          description: role name
        flags:
        - name: verb
          required: true
          value: get
        - name: resource
          required: true
          value: pods/log
        - name: namespace
          short: n
          required: true
          value: dev
  explanation:
    elements:
    - type: context
      text: |
        `kubectl create role NAME --verb=... --resource=... [--resource-name=...] -n NS`

        - `--resource` accepts singular, plural and short names and resolves the API group for you (`deployments.apps` is also accepted).
        - Repeat the flag or separate values with commas.
        - Always check the result: `kubectl describe role pod-reader -n dev` prints the rules in a table.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
      - url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_role/
        text: kubectl create role
- title: Create Bindings with --serviceaccount
  category: Imperative Commands
  hintsEnabled: true
  elements:
  - type: context
    text: |
      `kubectl create rolebinding` takes **one** of `--role` or `--clusterrole`, and any number of
      `--user`, `--group` and `--serviceaccount` subjects. The ServiceAccount flag has its own format.

      Namespace `dev` contains the Role `pod-reader` and the ServiceAccount `builder`.
  - type: question
    question:
      questionType: command
      header: Create a RoleBinding named `builder-pods` in `dev` that gives the Role `pod-reader` to the ServiceAccount `builder`
        of namespace `dev`.
      hint: The format of the flag is `<namespace>:<name>`, not the full user name.
      correctAnswerInfo: '`--serviceaccount=dev:builder` is `namespace:name`. The full `system:serviceaccount:dev:builder`
        is the *user name*, which kubectl rejects here.'
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: rolebinding
        positionals:
        - index: 0
          value: builder-pods
          description: binding name
        flags:
        - name: role
          required: true
          value: pod-reader
        - name: serviceaccount
          required: true
          value: dev:builder
        - name: namespace
          short: n
          required: true
          value: dev
  - type: question
    question:
      questionType: command
      header: Create a RoleBinding named `auditors-view` in `prod` that gives the ClusterRole `view` to the group `auditors`.
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: rolebinding
        positionals:
        - index: 0
          value: auditors-view
          description: binding name
        flags:
        - name: clusterrole
          required: true
          value: view
        - name: group
          required: true
          value: auditors
        - name: namespace
          short: n
          required: true
          value: prod
  - type: question
    question:
      questionType: command
      header: Create a RoleBinding named `ops-edit` in `prod` that gives the ClusterRole `edit` to the user `jane` **and**
        the ServiceAccount `deployer` of namespace `ci`.
      hint: Subject flags can be combined in one command.
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: rolebinding
        positionals:
        - index: 0
          value: ops-edit
          description: binding name
        flags:
        - name: clusterrole
          required: true
          value: edit
        - name: user
          required: true
          value: jane
        - name: serviceaccount
          required: true
          value: ci:deployer
        - name: namespace
          short: n
          required: true
          value: prod
  explanation:
    elements:
    - type: context
      text: |
        | Flag | Value format |
        |---|---|
        | `--user` | the user name as the authenticator reports it |
        | `--group` | a group name |
        | `--serviceaccount` | `<namespace>:<name>` |
        | `--role` / `--clusterrole` | the role being granted (exactly one) |

        A RoleBinding created with `--clusterrole` still grants only inside `-n <namespace>`.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
      - url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_rolebinding/
        text: kubectl create rolebinding
- title: Cluster-wide Roles and Bindings
  category: Imperative Commands
  hintsEnabled: true
  elements:
  - type: context
    text: |
      The cluster-scoped variants take no `-n` flag. A monitoring agent runs as ServiceAccount `prometheus` in namespace
      `monitoring` and needs to read Nodes and the `/metrics` endpoint everywhere.
  - type: question
    question:
      questionType: command
      header: Create a ClusterRole named `node-reader` that may `get`, `list` and `watch` Nodes.
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: clusterrole
        positionals:
        - index: 0
          value: node-reader
          description: role name
        flags:
        - name: verb
          required: true
          repeatable: true
        - name: resource
          required: true
          oneOf:
          - nodes
          - node
          - 'no'
      cel:
      - name: Verbs
        expression: '(type(flags.verb) == list ? flags.verb.join('','') : flags.verb).split('','').size() == 3 && [''get'',
          ''list'', ''watch''].all(v, v in (type(flags.verb) == list ? flags.verb.join('','') : flags.verb).split('',''))'
        message: The role must allow reading Nodes with exactly the three read verbs
  - type: question
    question:
      questionType: command
      header: Create a ClusterRole named `metrics-get` that allows `get` on the non-resource URL `/metrics`.
      hint: There is a dedicated flag for URLs that are not resources.
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: clusterrole
        positionals:
        - index: 0
          value: metrics-get
          description: role name
        flags:
        - name: verb
          required: true
          value: get
        - name: non-resource-url
          required: true
          value: /metrics
  - type: question
    question:
      questionType: command
      header: Create a ClusterRoleBinding named `prometheus-nodes` that gives the ClusterRole `node-reader` to the ServiceAccount
        `prometheus` of namespace `monitoring`.
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: clusterrolebinding
        positionals:
        - index: 0
          value: prometheus-nodes
          description: binding name
        flags:
        - name: clusterrole
          required: true
          value: node-reader
        - name: serviceaccount
          required: true
          value: monitoring:prometheus
  explanation:
    elements:
    - type: context
      text: |
        `create clusterrole` and `create clusterrolebinding` mirror the namespaced commands. A ClusterRoleBinding applies to **all** namespaces,
        so check carefully before using it for anything that touches Secrets or Pods.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: Generate YAML and Refine It
  category: Imperative Commands
  hintsEnabled: true
  elements:
  - type: context
    text: |
      The imperative commands are a fast way to start a manifest: add `--dry-run=client -o yaml` and redirect the output to a file,
      then edit it for anything the flags cannot express.
  - type: question
    question:
      questionType: command
      header: Generate (without creating) the YAML of a Role named `cm-reader` that allows `get` on ConfigMaps in `dev`, and
        save it to `role.yaml`.
      hint: Dry-run on the client side, YAML output, redirect.
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: role
        positionals:
        - index: 0
          value: cm-reader
          description: role name
        flags:
        - name: verb
          required: true
          value: get
        - name: resource
          required: true
          oneOf:
          - configmaps
          - configmap
          - cm
        - name: namespace
          short: n
          required: true
          value: dev
        - name: dry-run
          required: true
          value: client
        - name: output
          short: o
          required: true
          value: yaml
      modifiers:
      - type: Redirect
        redirect:
          type: '>'
          value: role.yaml
  - type: question
    question:
      questionType: single-line
      header: Which rule field would you add to the generated YAML to restrict it to a single ConfigMap?
      hint: A list that sits next to `resources`.
      expectedAnswer: resourceNames
      cel: answer.trim().lowerAscii() in ['resourcenames']
  explanation:
    elements:
    - type: context
      text: |
        `--dry-run=client` builds the object locally; `-o yaml` prints it. Apply with `kubectl apply -f role.yaml`.
        Flags that need an editor afterwards: `resourceNames` on multiple rules, `aggregationRule`, labels.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: Write a Role with Two Rules
  category: RBAC Manifests
  hintsEnabled: true
  elements:
  - type: context
    text: |
      The CD tool in `prod` must **read** Pods and **read, create and patch** Deployments, nothing else. The scaffold below
      contains only the header of the Role.
  - type: question
    question:
      questionType: manifest
      header: Complete the Role `deploy-manager` in `prod`.
      hint: Pods are in the core group; Deployments are not.
      correctAnswerInfo: 'Two rules are needed because the two resources live in different API groups. Mixing them in one
        rule with `apiGroups: ["", "apps"]` also works but would grant the verbs on every combination.'
      manifestDefinitionId: role-v1
      initialContent: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: deploy-manager
          namespace: prod
        rules:
      expectedFields:
      - path: metadata.name
        expectedValue: deploy-manager
      - path: metadata.namespace
        expectedValue: prod
      cel:
      - name: Pods are readable
        expression: manifest.rules.exists(r, '' in r.apiGroups && 'pods' in r.resources && ['get','list','watch'].all(v, v
          in r.verbs))
        message: Pods must be readable (get, list, watch)
      - name: Deployments can be managed
        expression: manifest.rules.exists(r, 'apps' in r.apiGroups && 'deployments' in r.resources && ['get','list','create','patch'].all(v,
          v in r.verbs))
        message: Deployments must be readable, creatable and patchable
      - name: No deletes or wildcards
        expression: manifest.rules.all(r, !('*' in r.verbs) && !('*' in r.resources) && !('delete' in r.verbs))
        message: No wildcards and no delete
  explanation:
    elements:
    - type: context
      text: |
        Rules are evaluated independently and added together. Group them by API group and keep the verbs of each resource as small as the task allows.
        `kubectl auth can-i --list --as ...` shows the result in a table.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: RoleBinding to a Built-in ClusterRole
  category: RBAC Manifests
  hintsEnabled: true
  elements:
  - type: context
    text: |
      The group `dev-team` should be able to edit most objects in namespace `dev` and nowhere else. The built-in ClusterRole
      `edit` already contains the rules.
  - type: question
    question:
      questionType: manifest
      header: Write the RoleBinding `dev-team-edit` in `dev` for the **group** `dev-team`.
      hint: A group subject has a name and the RBAC apiGroup.
      manifestDefinitionId: rolebinding-v1
      initialContent: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: dev-team-edit
          namespace: dev
      expectedFields:
      - path: metadata.name
        expectedValue: dev-team-edit
      - path: metadata.namespace
        expectedValue: dev
      - path: roleRef.kind
        expectedValue: ClusterRole
      - path: roleRef.name
        expectedValue: edit
      - path: roleRef.apiGroup
        expectedValue: rbac.authorization.k8s.io
      - path: subjects.0.kind
        expectedValue: Group
      - path: subjects.0.name
        expectedValue: dev-team
      cel:
      - name: Single subject
        expression: size(manifest.subjects) == 1
        message: Only the group should be bound
  - type: question
    question:
      questionType: single-line
      header: In how many namespaces does the group get `edit` rights through this binding?
      hint: What limits a RoleBinding?
      expectedAnswer: '1'
      cel: answer.trim().lowerAscii() in ['1', 'one']
  explanation:
    elements:
    - type: context
      text: |
        Most real-world grants look like this: a built-in ClusterRole (`view`, `edit`, `admin`) bound through RoleBindings, one per namespace.
        This keeps the role definitions in one place and the blast radius of each binding in one namespace.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: Fix a Role That Grants Nothing
  category: RBAC Manifests
  hintsEnabled: true
  elements:
  - type: context
    text: |
      A user bound to this Role in `prod` can still not list Deployments. The manifest is accepted by the API server without
      a single warning:
  - type: question
    question:
      questionType: manifest
      header: Correct the rule so that the Role allows `get` and `list` on Deployments.
      hint: Two things are wrong, one in each of two fields.
      correctAnswerInfo: RBAC does not check that groups or resource names exist. A rule with the wrong group or a singular/capitalised
        name is valid YAML and matches nothing.
      manifestDefinitionId: role-v1
      initialContent: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: deploy-reader
          namespace: prod
        rules:
        - apiGroups: [""]
          resources: ["Deployment"]
          verbs: ["get", "list"]
      expectedFields:
      - path: metadata.name
        expectedValue: deploy-reader
      cel:
      - name: Right API group
        expression: manifest.rules.exists(r, 'apps' in r.apiGroups)
        message: Deployments are not in the core API group
      - name: Right resource name
        expression: manifest.rules.exists(r, 'deployments' in r.resources)
        message: The resource must be named exactly as the API serves it
      - name: Read verbs only
        expression: manifest.rules.all(r, r.verbs.all(v, v in ['get', 'list']))
        message: Keep the role read-only
  explanation:
    elements:
    - type: context
      text: |
        When a grant "does not work", test it instead of re-reading the YAML: `kubectl auth can-i list deployments.apps -n prod --as <user>`.
        `kubectl describe role` shows how the API server interpreted every rule (resource, non-resource URLs, resource names, verbs).
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: kubectl auth can-i
  category: Checking Permissions
  hintsEnabled: true
  elements:
  - type: context
    text: |
      `kubectl auth can-i VERB RESOURCE` asks the API server whether the **current** identity may perform an action and prints
      `yes` or `no`. As cluster admin you can ask on behalf of anybody with `--as`, which is how you verify a binding without
      logging in as that subject.
  - type: question
    question:
      questionType: command
      header: Check whether the user `jane` may list Pods in namespace `dev`.
      command:
        executable: kubectl
        subcommands:
        - name: auth
        - name: can-i
        positionals:
        - index: 0
          value: list
        - index: 1
          oneOf:
          - pods
          - pod
          - po
        flags:
        - name: as
          required: true
          value: jane
        - name: namespace
          short: n
          required: true
          value: dev
  - type: question
    question:
      questionType: command
      header: Check whether the ServiceAccount `builder` of namespace `ci` may `get` Secrets in namespace `prod`.
      hint: Impersonate the full user name of the account.
      command:
        executable: kubectl
        subcommands:
        - name: auth
        - name: can-i
        positionals:
        - index: 0
          value: get
        - index: 1
          oneOf:
          - secrets
          - secret
        flags:
        - name: as
          required: true
          value: system:serviceaccount:ci:builder
        - name: namespace
          short: n
          required: true
          value: prod
  - type: question
    question:
      questionType: command
      header: Check whether the user `jane` may `delete` Nodes.
      hint: Nodes are not namespaced.
      command:
        executable: kubectl
        subcommands:
        - name: auth
        - name: can-i
        positionals:
        - index: 0
          value: delete
        - index: 1
          oneOf:
          - nodes
          - node
          - 'no'
        flags:
        - name: as
          required: true
          value: jane
  - type: question
    question:
      questionType: single-line
      header: For a user or ServiceAccount that does not exist at all, what does `kubectl auth can-i ... --as <that name>`
        print for an action nothing grants? (yes/no)
      correctAnswerInfo: Impersonation does not require the identity to exist. A subject with no bindings simply gets `no`,
        which is why `can-i` cannot tell a typo from a missing permission.
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  explanation:
    elements:
    - type: context
      text: |
        `can-i` asks the same authorizer chain that real requests go through, so it is the ground truth for RBAC. Exit status is 0 for `yes`
        and 1 for `no`, which makes it usable in scripts.

        Impersonating (`--as`) requires that *you* hold `impersonate` on the target; cluster-admin does.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/#checking-api-access
        text: Checking API access
- title: Group Membership with --as-group
  category: Checking Permissions
  hintsEnabled: true
  elements:
  - type: context
    text: |
      A ClusterRoleBinding gives the ClusterRole `view` to the **group** `sre`. The user `kim` authenticates with a certificate whose
      organisation (`O=`) is `sre`, so the API server treats `kim` as a member. To test this from the admin's workstation you must say
      what groups the impersonated user is in; kubectl cannot look it up.
  - type: question
    question:
      questionType: command
      header: Check whether `kim`, as a member of the group `sre`, may list Pods in namespace `dev`.
      command:
        executable: kubectl
        subcommands:
        - name: auth
        - name: can-i
        positionals:
        - index: 0
          value: list
        - index: 1
          oneOf:
          - pods
          - pod
          - po
        flags:
        - name: as
          required: true
          value: kim
        - name: as-group
          required: true
          value: sre
        - name: namespace
          short: n
          required: true
          value: dev
  - type: question
    question:
      questionType: single-line
      header: Does `kubectl auth can-i list pods --as kim -n dev` (without `--as-group`) print `yes` for this binding? (yes/no)
      hint: Does impersonating a name alone add any groups?
      correctAnswerInfo: Only the groups you pass are attached to the impersonated request (plus `system:authenticated`).
        Group-based bindings are therefore invisible unless `--as-group` is given.
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  - type: question
    question:
      questionType: single-line
      header: Can `--as-group` be used **without** `--as`? (yes/no)
      correctAnswerInfo: Group impersonation needs an impersonated user name to go with it, so always pair the two flags.
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  explanation:
    elements:
    - type: context
      text: |
        Remember when reading results: `no` may mean "no binding", "wrong subject name" or "forgot the groups". Test both the user and the group views of a subject.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/#checking-api-access
        text: Checking API access
- title: can-i --list
  category: Checking Permissions
  hintsEnabled: true
  elements:
  - type: context
    text: |
      `--list` prints everything an identity may do in one namespace. The output of a check for ServiceAccount `reports-sa` in `finance` (an excerpt; the real output has more rows):
  - type: question
    question:
      questionType: command
      header: List all actions the ServiceAccount `reports-sa` of namespace `finance` may perform in `finance`.
      command:
        executable: kubectl
        subcommands:
        - name: auth
        - name: can-i
        flags:
        - name: list
          required: true
          boolean: true
        - name: as
          required: true
          value: system:serviceaccount:finance:reports-sa
        - name: namespace
          short: n
          required: true
          value: finance
  - type: table
    style: terminal
    columns:
    - Resources
    - Non-Resource URLs
    - Resource Names
    - Verbs
    rows:
    - - selfsubjectreviews.authentication.k8s.io
      - '[]'
      - '[]'
      - '[create]'
    - - selfsubjectaccessreviews.authorization.k8s.io
      - '[]'
      - '[]'
      - '[create]'
    - - configmaps
      - '[]'
      - '[]'
      - '[get list]'
    - - secrets
      - '[]'
      - '[reports-db]'
      - '[get]'
    - - ''
      - '[/healthz]'
      - '[]'
      - '[get]'
    - - ''
      - '[/version]'
      - '[]'
      - '[get]'
  - type: question
    question:
      questionType: single-line
      header: Which Secret can the account read?
      hint: Look at the Resource Names column.
      expectedAnswer: reports-db
      cel: answer.trim().lowerAscii() in ['reports-db']
  - type: question
    question:
      questionType: single-line
      header: Which verbs does the account have on ConfigMaps? (comma-separated)
      expectedAnswer: get, list
      cel: answer.trim().lowerAscii() in ['get, list', 'get,list', 'list, get', 'list,get', 'get list', 'list get', 'get and
        list', 'list and get']
  - type: question
    question:
      questionType: single-line
      header: Can the account list Secrets? (yes/no)
      hint: A rule limited by Resource Names only applies to named objects.
      correctAnswerInfo: '`list` is not granted at all, only `get` on one named Secret. Note: a `list` rule with `resourceNames`
        would only work for requests that filter by that name (`?fieldSelector=metadata.name=...`).'
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  explanation:
    elements:
    - type: context
      text: |
        The first rows (`selfsubjectreviews`, `selfsubjectaccessreviews`) come from the built-in `system:basic-user` and
        `system:public-info-viewer` roles that every authenticated identity gets. They let a user ask `can-i` and `whoami` about themselves and are not a finding.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/#checking-api-access
        text: Checking API access
- title: can-i with Subresources
  category: Checking Permissions
  hintsEnabled: true
  elements:
  - type: context
    text: |
      A subresource is checked with a `resource/subresource` argument or the `--subresource` flag. The user `kim` holds the Role `pod-viewer` in `dev`,
      which allows `get`, `list` and `watch` on `pods` only.
  - type: question
    question:
      questionType: command
      header: Check whether `kim` may `create` in the `exec` subresource of Pods, in `dev`.
      command:
        executable: kubectl
        subcommands:
        - name: auth
        - name: can-i
        positionals:
        - index: 0
          value: create
        - index: 1
          regex: ^pods?/exec$
        flags:
        - name: as
          required: true
          value: kim
        - name: namespace
          short: n
          required: true
          value: dev
  - type: question
    question:
      questionType: command
      header: Check whether `kim` may `get` the **log** subresource of Pods, in `dev`, using the dedicated flag.
      hint: A flag instead of the slash syntax.
      command:
        executable: kubectl
        subcommands:
        - name: auth
        - name: can-i
        positionals:
        - index: 0
          value: get
        - index: 1
          oneOf:
          - pods
          - pod
          - po
        flags:
        - name: as
          required: true
          value: kim
        - name: namespace
          short: n
          required: true
          value: dev
        - name: subresource
          required: true
          value: log
  - type: question
    question:
      questionType: single-line
      header: What will both checks print for `kim`? (one word)
      hint: Does the Role mention `pods/exec` or `pods/log`?
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  explanation:
    elements:
    - type: context
      text: |
        Equivalent forms: `kubectl auth can-i get pods/log` and `kubectl auth can-i get pods --subresource=log`.
        Checking subresources matters in reviews: `pods/exec`, `pods/portforward`, `serviceaccounts/token` and `nodes/proxy` are the common sources of surprise.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/authorization/#checking-api-access
        text: Checking API access
- title: Who Am I?
  category: Checking Permissions
  hintsEnabled: true
  elements:
  - type: context
    text: |
      Before debugging permissions, confirm which identity kubectl is using. `kubectl auth whoami` prints the identity
      the API server derived from the credentials. On a kubeadm 1.34 cluster the `admin.conf` credentials give:
  - type: question
    question:
      questionType: command
      header: Show the identity of the current kubeconfig credentials.
      command:
        executable: kubectl
        subcommands:
        - name: auth
        - name: whoami
  - type: table
    style: terminal
    columns:
    - ATTRIBUTE
    - VALUE
    rows:
    - - Username
      - kubernetes-admin
    - - Groups
      - '[kubeadm:cluster-admins system:authenticated]'
  - type: question
    question:
      questionType: single-line
      header: Which group gives this user its administrator rights (through a ClusterRoleBinding to `cluster-admin`)?
      hint: One of the two groups is not a default one.
      correctAnswerInfo: 'Since kubeadm 1.29 `admin.conf` is a normal RBAC identity: the group `kubeadm:cluster-admins` is
        bound to `cluster-admin` by the ClusterRoleBinding of the same name. The break-glass `super-admin.conf` uses `system:masters`
        instead.'
      expectedAnswer: kubeadm:cluster-admins
      cel: answer.trim().lowerAscii() in ['kubeadm:cluster-admins']
  - type: question
    question:
      questionType: single-line
      header: Would deleting the ClusterRoleBinding `kubeadm:cluster-admins` remove this user's access? (yes/no)
      hint: Is the group hard-coded anywhere?
      correctAnswerInfo: 'Yes: access flows through an ordinary binding, so it can be audited and revoked. Members of `system:masters`
        cannot be revoked that way.'
      expectedAnswer: 'yes'
      cel: answer.trim().lowerAscii() in ['yes']
  explanation:
    elements:
    - type: context
      text: |
        `whoami` needs the `SelfSubjectReview` API (enabled by default since 1.28). On older clusters use `kubectl auth can-i --list` or read the certificate with `openssl x509 -text`.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/#self-subject-review
        text: Self subject review
- title: List and Read Bindings
  category: Auditing Access
  hintsEnabled: true
  elements:
  - type: context
    text: |
      An audit starts with the question "who has what?". The wide output of the binding lists shows the role and every subject on
      one line. The cluster-wide ones come first, because they apply everywhere.
  - type: question
    question:
      questionType: command
      header: List all ClusterRoleBindings with the wide output format.
      command:
        executable: kubectl
        subcommands:
        - name: get
        - name: clusterrolebindings
          aliases:
          - clusterrolebinding
        flags:
        - name: output
          short: o
          required: true
          value: wide
  - type: table
    style: terminal
    columns:
    - NAME
    - ROLE
    - AGE
    - USERS
    - GROUPS
    - SERVICEACCOUNTS
    rows:
    - - cluster-admin
      - ClusterRole/cluster-admin
      - 120d
      - ''
      - system:masters
      - ''
    - - kubeadm:cluster-admins
      - ClusterRole/cluster-admin
      - 120d
      - ''
      - kubeadm:cluster-admins
      - ''
    - - ci-deployer-admin
      - ClusterRole/cluster-admin
      - 60d
      - ''
      - ''
      - ci/builder
    - - dave-superuser
      - ClusterRole/cluster-admin
      - 45d
      - dave
      - ''
      - ''
    - - metrics-view
      - ClusterRole/view
      - 30d
      - ''
      - ''
      - monitoring/prometheus
    - - system:basic-user
      - ClusterRole/system:basic-user
      - 120d
      - ''
      - system:authenticated
      - ''
    - - system:discovery
      - ClusterRole/system:discovery
      - 120d
      - ''
      - system:authenticated
      - ''
    - - system:public-info-viewer
      - ClusterRole/system:public-info-viewer
      - 120d
      - ''
      - system:authenticated,system:unauthenticated
      - ''
  - type: question
    question:
      questionType: single-line
      header: Which ServiceAccount (as `namespace/name`) is bound to `cluster-admin`?
      hint: Check the last column of the cluster-admin rows.
      correctAnswerInfo: Any Pod running as `ci/builder` is effectively root on the cluster, and so is anyone who can create
        a Pod in `ci` using that account.
      expectedAnswer: ci/builder
      cel: answer.trim().lowerAscii() in ['ci/builder']
  - type: question
    question:
      questionType: single-line
      header: Which **user** is bound to `cluster-admin`?
      expectedAnswer: dave
      cel: answer.trim().lowerAscii() in ['dave']
  - type: question
    question:
      questionType: command
      header: List the RoleBindings of **all** namespaces with the wide output format.
      command:
        executable: kubectl
        subcommands:
        - name: get
        - name: rolebindings
          aliases:
          - rolebinding
        flags:
        - name: all-namespaces
          short: A
          required: true
          boolean: true
        - name: output
          short: o
          required: true
          value: wide
  explanation:
    elements:
    - type: context
      text: |
        `kubectl get rolebindings,clusterrolebindings -A -o wide` lists both kinds in two tables. Look for:

        - `cluster-admin` (or `admin`/`edit`) granted to anything but the built-in `system:masters` and `kubeadm:cluster-admins` groups
        - ServiceAccounts and groups such as `system:authenticated` or `system:serviceaccounts` as subjects of powerful roles
        - bindings to users/groups that no longer exist in your identity provider
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: Find cluster-admin Bindings Quickly
  category: Auditing Access
  hintsEnabled: true
  elements:
  - type: context
    text: |
      On a cluster with hundreds of bindings you filter. The task: print only the ClusterRoleBinding lines that mention `cluster-admin`,
      using `grep` on the wide output.
  - type: question
    question:
      questionType: command
      header: Show only the lines of the wide ClusterRoleBinding list that contain `cluster-admin`.
      command:
        executable: kubectl
        subcommands:
        - name: get
        - name: clusterrolebindings
          aliases:
          - clusterrolebinding
        flags:
        - name: output
          short: o
          required: true
          value: wide
      modifiers:
      - type: Pipe
        pipe:
          command:
            executable: grep
            positionals:
            - index: 0
              value: cluster-admin
  - type: table
    style: terminal
    columns:
    - NAME
    - ROLE
    - AGE
    - USERS
    - GROUPS
    - SERVICEACCOUNTS
    rows:
    - - cluster-admin
      - ClusterRole/cluster-admin
      - 120d
      - ''
      - system:masters
      - ''
    - - kubeadm:cluster-admins
      - ClusterRole/cluster-admin
      - 120d
      - ''
      - kubeadm:cluster-admins
      - ''
    - - ci-deployer-admin
      - ClusterRole/cluster-admin
      - 60d
      - ''
      - ''
      - ci/builder
    - - dave-superuser
      - ClusterRole/cluster-admin
      - 45d
      - dave
      - ''
      - ''
  - type: question
    question:
      questionType: single-line
      header: How many of these rows give `cluster-admin` to a **user or ServiceAccount** (not to a group)?
      hint: Check the USERS and SERVICEACCOUNTS columns.
      expectedAnswer: '2'
      cel: answer.trim().lowerAscii() in ['2']
  - type: question
    question:
      questionType: command
      header: Remove the over-broad binding `dave-superuser`.
      command:
        executable: kubectl
        subcommands:
        - name: delete
        - name: clusterrolebinding
          aliases:
          - clusterrolebindings
        positionals:
        - index: 0
          value: dave-superuser
  explanation:
    elements:
    - type: context
      text: |
        Do not delete the built-in `cluster-admin` and `kubeadm:cluster-admins` bindings; cluster components and the kubeadm `admin.conf` rely on them.
        When removing a legitimate user's admin binding, create the replacement (a narrower binding) first so work is not interrupted.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: Anonymous and Unauthenticated Access
  category: Auditing Access
  hintsEnabled: true
  elements:
  - type: context
    text: |
      Requests without credentials are processed as the user `system:anonymous` in the group `system:unauthenticated` when the API
      server flag `--anonymous-auth` is true (the default). Every identity also belongs to `system:authenticated` once it has logged in.
      These ClusterRoleBindings exist:
  - type: table
    style: terminal
    columns:
    - NAME
    - ROLE
    - AGE
    - USERS
    - GROUPS
    - SERVICEACCOUNTS
    rows:
    - - anon-reader
      - ClusterRole/view
      - 10d
      - ''
      - system:unauthenticated
      - ''
    - - everyone-edit
      - ClusterRole/edit
      - 25d
      - ''
      - system:authenticated
      - ''
    - - system:public-info-viewer
      - ClusterRole/system:public-info-viewer
      - 120d
      - ''
      - system:authenticated,system:unauthenticated
      - ''
    - - system:discovery
      - ClusterRole/system:discovery
      - 120d
      - ''
      - system:authenticated
      - ''
  - type: question
    question:
      questionType: single-line
      header: Which binding gives **anybody on the network** read access to most objects?
      hint: Look for the unauthenticated group on a powerful role.
      expectedAnswer: anon-reader
      cel: answer.trim().lowerAscii() in ['anon-reader']
  - type: question
    question:
      questionType: single-line
      header: Which binding gives every **logged-in** user, including every ServiceAccount, edit rights?
      expectedAnswer: everyone-edit
      cel: answer.trim().lowerAscii() in ['everyone-edit']
  - type: question
    question:
      questionType: command
      header: Delete the binding that grants access to unauthenticated users (the anonymous user and group).
      command:
        executable: kubectl
        subcommands:
        - name: delete
        - name: clusterrolebinding
        positionals:
        - index: 0
          value: anon-reader
  - type: question
    question:
      questionType: single-line
      header: Which kube-apiserver flag would you set to `false` to disable anonymous requests altogether?
      hint: It is an authentication flag.
      correctAnswerInfo: With `--anonymous-auth=false` such requests are answered with `401`. Some health checks (`/healthz`
        from load balancers or kubeadm probes) use anonymous access, so check before disabling it.
      expectedAnswer: --anonymous-auth
      cel: answer.trim().lowerAscii() in ['--anonymous-auth', 'anonymous-auth', '--anonymous-auth=false']
  - type: question
    question:
      questionType: single-line
      header: With anonymous access enabled but no binding for it, which HTTP status does an unauthenticated `curl -k https://<apiserver>:6443/api/v1/namespaces`
        return?
      hint: The request is authenticated as `system:anonymous`, just not authorized.
      correctAnswerInfo: '`401` means the request could not be authenticated at all (for example a bad token, or anonymous
        access disabled); `403` means the identity was established but RBAC denied the action.'
      expectedAnswer: '403'
      cel: answer.trim().lowerAscii() in ['403']
  explanation:
    elements:
    - type: context
      text: |
        `system:public-info-viewer` and `system:discovery` are default bindings that expose `/version`, `/healthz`, API discovery and similar harmless endpoints.
        They are not findings by themselves, but any binding of `system:unauthenticated` or `system:authenticated` to a role that reads or writes **objects** is.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/#anonymous-requests
        text: Anonymous requests
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: Spot the Problems in a Role
  category: Auditing Access
  hintsEnabled: true
  elements:
  - type: context
    text: |
      A review request lands on your desk. The Role below is bound to the ServiceAccount used by the platform team's automation in
      `shop`. Rules are numbered in comments.
  - type: manifest
    header: Role platform-helper
    content: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: platform-helper
        namespace: shop
      rules:
      # rule 1
      - apiGroups: [""]
        resources: ["pods", "configmaps"]
        verbs: ["get", "list", "watch"]
      # rule 2
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["list", "watch"]
      # rule 3
      - apiGroups: [""]
        resources: ["pods/exec"]
        verbs: ["create"]
      # rule 4
      - apiGroups: ["rbac.authorization.k8s.io"]
        resources: ["rolebindings"]
        verbs: ["create", "update", "patch"]
      # rule 5
      - apiGroups: ["apps"]
        resources: ["*"]
        verbs: ["*"]
  - type: question
    question:
      questionType: single-line
      header: Which rule number lets the holder read Secret values without being able to `get` a single Secret by name?
      hint: Think about which verbs return full objects.
      correctAnswerInfo: '`list` and `watch` on `secrets` return the data of every Secret in the namespace.'
      expectedAnswer: '2'
      cel: answer.trim().lowerAscii() in ['2', 'rule 2']
  - type: question
    question:
      questionType: single-line
      header: Which rule number lets the holder run commands inside any Pod of the namespace?
      expectedAnswer: '3'
      cel: answer.trim().lowerAscii() in ['3', 'rule 3']
  - type: question
    question:
      questionType: single-line
      header: Which rule number lets the holder create new bindings and so hand out permissions?
      correctAnswerInfo: Even with the escalation checks (a user can only bind roles whose permissions they already hold),
        write access to bindings lets the holder attach any role they have to anyone, including themselves. It is a persistence
        and lateral-movement tool.
      expectedAnswer: '4'
      cel: answer.trim().lowerAscii() in ['4', 'rule 4']
  - type: question
    question:
      questionType: single-line
      header: Which rule number contains wildcards?
      expectedAnswer: '5'
      cel: answer.trim().lowerAscii() in ['5', 'rule 5']
  - type: question
    question:
      questionType: single-line
      header: Which single rule number is acceptable as written (nothing to change for least privilege)?
      expectedAnswer: '1'
      cel: answer.trim().lowerAscii() in ['1', 'rule 1']
  explanation:
    elements:
    - type: context
      text: |
        A short review checklist for roles:

        - wildcards in `verbs`, `resources` or `apiGroups`
        - `secrets` with `get`, `list` or `watch`
        - `pods/exec`, `pods/attach`, `pods/portforward`, `nodes/proxy` (any verb: on 1.34 `get` on `pods/exec` already allows `kubectl exec`)
        - `create`/`update`/`patch` on `roles`, `rolebindings`, `clusterroles`, `clusterrolebindings`
        - `escalate`, `bind`, `impersonate`
        - `create` on `pods` in a namespace that has powerful ServiceAccounts
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: Fix an Over-Privileged ServiceAccount
  category: Auditing Access
  hintsEnabled: true
  elements:
  - type: context
    text: |
      **Ticket:** the app `inventory` in namespace `shop` runs as ServiceAccount `app`. During an audit you found the
      ClusterRoleBinding `app-admin`, which gives `app` the ClusterRole `cluster-admin`. The application only reads ConfigMaps in `shop`.

      Replace the binding with the least privilege that keeps the app working.
  - type: question
    question:
      questionType: command
      header: Remove the over-privileged binding.
      command:
        executable: kubectl
        subcommands:
        - name: delete
        - name: clusterrolebinding
        positionals:
        - index: 0
          value: app-admin
  - type: question
    question:
      questionType: command
      header: Create a Role named `cm-reader` in `shop` that may `get`, `list` and `watch` ConfigMaps.
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: role
        positionals:
        - index: 0
          value: cm-reader
        flags:
        - name: verb
          required: true
          repeatable: true
        - name: resource
          required: true
          oneOf:
          - configmaps
          - configmap
          - cm
        - name: namespace
          short: n
          required: true
          value: shop
      cel:
      - name: Read verbs
        expression: '(type(flags.verb) == list ? flags.verb.join('','') : flags.verb).split('','').all(v, v in [''get'',''list'',''watch''])'
        message: Only read verbs may be granted
      - name: Enough to read
        expression: '[''get'',''list''].all(v, v in (type(flags.verb) == list ? flags.verb.join('','') : flags.verb).split('',''))'
        message: The app must be able to get and list ConfigMaps
  - type: question
    question:
      questionType: command
      header: Bind the Role `cm-reader` to the ServiceAccount `app` with a RoleBinding named `app-cm-reader` in `shop`.
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: rolebinding
        positionals:
        - index: 0
          value: app-cm-reader
        flags:
        - name: role
          required: true
          value: cm-reader
        - name: serviceaccount
          required: true
          value: shop:app
        - name: namespace
          short: n
          required: true
          value: shop
  - type: question
    question:
      questionType: command
      header: Verify that the account can now list ConfigMaps in `shop`.
      command:
        executable: kubectl
        subcommands:
        - name: auth
        - name: can-i
        positionals:
        - index: 0
          value: list
        - index: 1
          oneOf:
          - configmaps
          - configmap
          - cm
        flags:
        - name: as
          required: true
          value: system:serviceaccount:shop:app
        - name: namespace
          short: n
          required: true
          value: shop
  - type: question
    question:
      questionType: command
      header: Verify that the account can **no longer** read Secrets in `shop`.
      command:
        executable: kubectl
        subcommands:
        - name: auth
        - name: can-i
        positionals:
        - index: 0
          value: get
        - index: 1
          oneOf:
          - secrets
          - secret
        flags:
        - name: as
          required: true
          value: system:serviceaccount:shop:app
        - name: namespace
          short: n
          required: true
          value: shop
  explanation:
    elements:
    - type: context
      text: |
        Order matters in production: create the narrow Role and binding first, confirm the app works, **then** delete the broad binding. Here the order was given
        by the ticket, and the verification step is how you prove both directions: what must work (`list configmaps` = `yes`) and what must not (`get secrets` = `no`).
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: The Built-in ClusterRoles
  category: Auditing Access
  hintsEnabled: true
  elements:
  - type: context
    text: |
      Kubernetes ships four general-purpose ClusterRoles meant for user-facing bindings:
  - type: table
    style: default
    columns:
    - ROLE
    - MEANT FOR
    - WHAT IT ALLOWS (summary)
    rows:
    - - cluster-admin
      - superusers
      - every action on every resource; bound with a RoleBinding, everything in that namespace
    - - admin
      - namespace administrators
      - almost everything in a namespace, including Roles and RoleBindings; no quota or namespace changes
    - - edit
      - developers
      - read/write most objects in a namespace, including Secrets; no Roles/RoleBindings
    - - view
      - read-only users
      - read most objects; no Secrets, no Roles/RoleBindings
  - type: question
    question:
      questionType: single-line
      header: Which of the four roles can read Secrets but cannot change RBAC objects?
      hint: It is the developer role.
      expectedAnswer: edit
      cel: answer.trim().lowerAscii() in ['edit']
  - type: question
    question:
      questionType: single-line
      header: Which of the four roles cannot read Secrets at all?
      expectedAnswer: view
      cel: answer.trim().lowerAscii() in ['view']
  - type: question
    question:
      questionType: single-line
      header: Which role, bound with a **RoleBinding**, lets the subject create Roles and RoleBindings inside that namespace?
      expectedAnswer: admin
      cel: answer.trim().lowerAscii() in ['admin']
  - type: question
    question:
      questionType: single-line
      header: A ClusterRoleBinding to `view` lets the subject read the Secrets of all namespaces. (true/false)
      correctAnswerInfo: '`view` deliberately excludes Secrets, because reading a ServiceAccount token Secret would let the
        reader act as that account.'
      expectedAnswer: 'false'
      cel: answer.trim().lowerAscii() in ['false', 'no']
  explanation:
    elements:
    - type: context
      text: |
        Use these built-ins rather than writing equivalents; they are maintained by Kubernetes and extended through aggregation.
        For anything that is not a person doing day-to-day work (CI, operators, apps) write a dedicated narrow Role instead of reusing `edit`.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: Aggregated ClusterRoles
  category: Auditing Access
  hintsEnabled: true
  elements:
  - type: context
    text: |
      The built-in `view`, `edit` and `admin` roles are **aggregated**: their rules are assembled from every ClusterRole that carries a matching label
      (`rbac.authorization.k8s.io/aggregate-to-view`, `-edit`, `-admin`). That is how CustomResourceDefinitions get picked up by the standard roles.

      An operator installs the CRD `crontabs.stable.example.com`.
  - type: question
    question:
      questionType: manifest
      header: Write a ClusterRole named `crontab-viewer` that adds read access (`get`, `list`, `watch`) on `crontabs` of the
        group `stable.example.com` to the built-in `view` role.
      hint: The aggregation is selected by a label on the ClusterRole.
      correctAnswerInfo: The controller merges the rules of every ClusterRole with that label into `view`. The label value
        must be the string `"true"`, so quote it in YAML.
      manifestDefinitionId: clusterrole-v1
      initialContent: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: crontab-viewer
      expectedFields:
      - path: metadata.name
        expectedValue: crontab-viewer
      cel:
      - name: Aggregated into view
        expression: has(manifest.metadata.labels) && 'rbac.authorization.k8s.io/aggregate-to-view' in manifest.metadata.labels
          && manifest.metadata.labels['rbac.authorization.k8s.io/aggregate-to-view'] == 'true'
        message: The role must be selected by the aggregation of the view role
      - name: Rule for crontabs
        expression: manifest.rules.exists(r, 'stable.example.com' in r.apiGroups && 'crontabs' in r.resources && ['get','list','watch'].all(v,
          v in r.verbs))
        message: Crontabs must be readable
      - name: Read-only
        expression: manifest.rules.all(r, r.verbs.all(v, v in ['get','list','watch']))
        message: Nothing but read verbs
  explanation:
    elements:
    - type: context
      text: |
        Aggregation is also an escalation vector: anyone who may create ClusterRoles can add rules to `view`, `edit` or `admin` by adding a label,
        and the rules then reach every subject bound to those roles. Treat `create`/`update` on `clusterroles` as highly privileged.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/#aggregated-clusterroles
        text: Aggregated ClusterRoles
- title: Pod Creation Is Power
  category: Privilege Escalation
  hintsEnabled: true
  elements:
  - type: context
    text: |
      The user `eve` holds only this permission in namespace `dev`: `create` on `pods`. She holds **no** rights on Secrets. Namespace `dev`
      also contains a ServiceAccount `deployer` that is bound to the ClusterRole `admin` for `dev`, and a Secret `db-credentials`.
  - type: question
    question:
      questionType: single-line
      header: Which field of the Pod spec lets `eve` run her Pod with the identity of `deployer`?
      hint: Pods choose their own ServiceAccount.
      expectedAnswer: serviceAccountName
      cel: answer.trim().lowerAscii() in ['serviceaccountname', 'spec.serviceaccountname']
  - type: question
    question:
      questionType: single-line
      header: Once the Pod runs, can `eve` obtain `deployer`'s permissions through the token mounted into it? (yes/no)
      correctAnswerInfo: Anything running in the Pod can read the projected token and call the API as `deployer`. `eve` only
        needs a way to run code in the Pod (command, image, or `exec`/logs).
      expectedAnswer: 'yes'
      cel: answer.trim().lowerAscii() in ['yes']
  - type: question
    question:
      questionType: single-line
      header: Can `eve` read the Secret `db-credentials` without any RBAC right on Secrets, by referencing it in her Pod?
        (yes/no)
      hint: Which Pod fields consume Secrets?
      correctAnswerInfo: Mounting a Secret as a volume or as environment variables is checked only by the kubelet node authorizer,
        not by the user's RBAC. Creating Pods in a namespace is therefore equivalent to reading its Secrets and using its
        ServiceAccounts.
      expectedAnswer: 'yes'
      cel: answer.trim().lowerAscii() in ['yes']
  - type: question
    question:
      questionType: single-line
      header: 'Name the principle: what must you avoid next to the right to create Pods in a namespace?'
      hint: What can the new Pod become?
      expectedAnswer: powerful serviceaccounts
      cel: answer.lowerAscii().contains('serviceaccount') || answer.lowerAscii().contains('service account')
  explanation:
    elements:
    - type: context
      text: |
        Mitigations: keep powerful ServiceAccounts (and Secrets) out of namespaces where others can create Pods; use dedicated, minimal ServiceAccounts per workload;
        set `automountServiceAccountToken: false` where the API is not needed; enforce Pod Security Admission so Pods cannot be privileged or use host paths.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
      - url: https://kubernetes.io/docs/concepts/security/service-accounts/
        text: Service Accounts
- title: escalate, bind and impersonate
  category: Privilege Escalation
  hintsEnabled: true
  elements:
  - type: context
    text: |
      Three verbs exist specifically to break RBAC's normal rules. They should be absent from almost every role:
  - type: table
    style: default
    columns:
    - VERB
    - ON RESOURCE
    - WHAT IT ALLOWS
    rows:
    - - escalate
      - roles, clusterroles
      - create or update a role with permissions the caller does not have
    - - bind
      - roles, clusterroles
      - create a binding to a role with permissions the caller does not have
    - - impersonate
      - users, groups, serviceaccounts
      - send requests as another identity
  - type: question
    question:
      questionType: single-line
      header: A Role grants `impersonate` on `users`. Which kubectl flag does the holder use to act as another user?
      expectedAnswer: --as
      cel: answer.trim().lowerAscii() in ['--as', 'as']
  - type: question
    question:
      questionType: single-line
      header: Which verb on `clusterroles` lets a subject write a ClusterRole that contains permissions the subject does not
        hold?
      expectedAnswer: escalate
      cel: answer.trim().lowerAscii() in ['escalate']
  - type: question
    question:
      questionType: single-line
      header: Which verb on `clusterroles` lets a subject create a RoleBinding to `cluster-admin` without holding all of its
        permissions?
      expectedAnswer: bind
      cel: answer.trim().lowerAscii() in ['bind']
  - type: question
    question:
      questionType: single-line
      header: A user may create RoleBindings and lacks the `bind` verb, but already holds every permission that the ClusterRole
        `view` contains. Can they bind `view`? (yes/no)
      correctAnswerInfo: The check is "does the caller already hold everything in the target role" **or** "has `bind` on it".
        Holding all of `view` makes binding `view` allowed; binding `cluster-admin` would not be.
      expectedAnswer: 'yes'
      cel: answer.trim().lowerAscii() in ['yes']
  explanation:
    elements:
    - type: context
      text: |
        These verbs also appear as `resourceNames`-restricted rules (for example `bind` on only `view`), which is a safe way to delegate role assignment.
        A role that contains any of them, or a wildcard verb, is effectively as powerful as the most powerful thing it can reach.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: Dangerous Resources
  category: Privilege Escalation
  hintsEnabled: true
  elements:
  - type: context
    text: |
      Besides Secrets and Pods, a few resources and subresources convert a small grant into a large one.
  - type: question
    question:
      questionType: single-line
      header: Which subresource of ServiceAccounts mints new tokens for an account (`kubectl create token`)?
      hint: Resource, slash, subresource.
      expectedAnswer: serviceaccounts/token
      cel: answer.trim().lowerAscii() in ['serviceaccounts/token', 'token', 'serviceaccount/token']
  - type: question
    question:
      questionType: single-line
      header: Which verb on that subresource creates a token?
      expectedAnswer: create
      cel: answer.trim().lowerAscii() in ['create']
  - type: question
    question:
      questionType: single-line
      header: Which subresource of Nodes forwards requests to the kubelet API, which can run commands in any Pod on that node?
      expectedAnswer: nodes/proxy
      cel: answer.trim().lowerAscii() in ['nodes/proxy']
  - type: question
    question:
      questionType: single-line
      header: Which subresource of CertificateSigningRequests must be updated (verb `update`) to approve a request?
      hint: There is a separate one for the status.
      correctAnswerInfo: Approval additionally needs the verb `approve` on the `signers` resource for the signer in question
        (for example `kubernetes.io/kube-apiserver-client`). A holder of both can obtain a client certificate for any user
        or group, for example `kubeadm:cluster-admins`, which is bound to `cluster-admin`; only `system:masters` itself is
        blocked, by the `CertificateSubjectRestriction` admission plugin.
      expectedAnswer: certificatesigningrequests/approval
      cel: answer.trim().lowerAscii() in ['certificatesigningrequests/approval', 'csr/approval']
  - type: question
    question:
      questionType: single-line
      header: Which verb on the `signers` resource, together with the right on `certificatesigningrequests/approval`, authorises
        approving a CSR for a given signer?
      expectedAnswer: approve
      cel: answer.trim().lowerAscii() in ['approve']
  explanation:
    elements:
    - type: context
      text: |
        Quick list of high-risk grants: `secrets` (get/list/watch), `pods/exec|attach|portforward`, `serviceaccounts/token`, `nodes/proxy`, `pods` (create), `persistentvolumes` (create, host paths),
        `roles|rolebindings|clusterroles|clusterrolebindings` (write), `certificatesigningrequests/approval`, `mutatingwebhookconfigurations` and `validatingwebhookconfigurations` (write).
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: Escalation Prevention in Action
  category: Privilege Escalation
  hintsEnabled: true
  elements:
  - type: context
    text: |
      The user `lee` has this Role in namespace `dev`. It allows managing Roles and RoleBindings (a typical "team lead" permission), and reading Pods:
  - type: manifest
    content: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: rbac-editor
        namespace: dev
      rules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        resources: ["roles", "rolebindings"]
        verbs: ["get", "list", "create", "update", "patch"]
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list"]
  - type: question
    question:
      questionType: command
      header: Impersonating `lee`, try to create a Role named `all-secrets` in `dev` that allows `get` on Secrets.
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: role
        positionals:
        - index: 0
          value: all-secrets
        flags:
        - name: verb
          required: true
          value: get
        - name: resource
          required: true
          oneOf:
          - secrets
          - secret
        - name: namespace
          short: n
          required: true
          value: dev
        - name: as
          required: true
          value: lee
  - type: table
    style: terminal
    columns:
    - OUTPUT
    rows:
    - - 'Error from server (Forbidden): roles.rbac.authorization.k8s.io "all-secrets" is forbidden: user "lee" (groups=["system:authenticated"])
        is attempting to grant RBAC permissions not currently held:'
    - - '{APIGroups:[""], Resources:["secrets"], Verbs:["get"]}'
  - type: question
    question:
      questionType: single-line
      header: Why was the request refused although `lee` may create Roles?
      hint: RBAC stops users from handing out what they do not have.
      correctAnswerInfo: 'RBAC escalation prevention: you can only create or update a role containing permissions you already
        hold (in that scope), unless you hold the `escalate` verb on roles.'
      expectedAnswer: lee does not hold the permissions being granted
      cel: answer.lowerAscii().contains('not') && (answer.lowerAscii().contains('hold') || answer.lowerAscii().contains('have')
        || answer.lowerAscii().contains('has') || answer.lowerAscii().contains('own')) || answer.lowerAscii().contains('escalat')
  - type: question
    question:
      questionType: single-line
      header: Which verb on `roles` would have allowed it?
      expectedAnswer: escalate
      cel: answer.trim().lowerAscii() in ['escalate']
  - type: question
    question:
      questionType: single-line
      header: Can `lee` get the same result by creating a RoleBinding that binds the built-in ClusterRole `edit` (which includes
        Secrets) to himself? (yes/no)
      hint: The same logic applies to bindings.
      correctAnswerInfo: Binding a role requires holding all its permissions or the `bind` verb. `lee` holds neither for `edit`,
        so this is refused as well.
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  explanation:
    elements:
    - type: context
      text: |
        Escalation prevention is why delegating "RBAC admin in a namespace" is reasonably safe: a delegate can only pass on what they already have.
        It is also why `escalate`, `bind` and `impersonate` are so dangerous: they switch the protection off for the role they are granted on.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: system:masters Bypasses RBAC
  category: Privilege Escalation
  hintsEnabled: true
  elements:
  - type: context
    text: |
      The API server never consults RBAC for members of the group `system:masters`; they are superusers by construction. The default
      `cluster-admin` ClusterRoleBinding for that group exists, but deleting it changes nothing for the group.
  - type: question
    question:
      questionType: single-line
      header: A user authenticates with a client certificate. Which certificate field decides the groups the API server assigns?
      hint: CN is the user name.
      correctAnswerInfo: In a client certificate, `CN` is the user name and every `O` (organisation) is a group. A certificate
        with `O=system:masters` is a permanent superuser credential.
      expectedAnswer: O
      cel: answer.trim().lowerAscii() in ['o', 'organization', 'organisation', 'organization (o)', 'o=', 'o (organization)']
  - type: question
    question:
      questionType: single-line
      header: Will deleting the ClusterRoleBinding `cluster-admin` remove the access of a certificate with `O=system:masters`?
        (yes/no)
      correctAnswerInfo: Authorization for this group is hard-coded in the authorizer chain. The only fix is to revoke the
        certificate (Kubernetes has no CRL; rotate the CA or the credential, or let it expire).
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  - type: question
    question:
      questionType: single-line
      header: Since kubeadm 1.29, which kubeconfig file holds the break-glass credential that is a member of `system:masters`?
      hint: '`admin.conf` no longer is.'
      correctAnswerInfo: '`admin.conf` now uses the group `kubeadm:cluster-admins` (a normal binding). `super-admin.conf`
        keeps `system:masters` for recovery, for example when the RBAC objects themselves are broken.'
      expectedAnswer: super-admin.conf
      cel: answer.trim().lowerAscii() in ['super-admin.conf', '/etc/kubernetes/super-admin.conf']
  explanation:
    elements:
    - type: context
      text: |
        Avoid issuing client certificates with `O=system:masters` for people; use a group such as `cluster-ops` bound to `cluster-admin` (or better, a narrower role) so access can be revoked by deleting a binding.
        See the CSR hands-on set for creating and approving user certificates.
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/certificate-signing-requests/
        text: Certificate Signing Requests
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: Dedicated ServiceAccounts
  category: ServiceAccounts
  hintsEnabled: true
  elements:
  - type: context
    text: |
      Every namespace has a ServiceAccount called `default`. A Pod that does not name one gets it, and so does every other Pod of the namespace.
      Granting anything to `default` therefore grants it to all workloads that did not choose otherwise. Instead, create one ServiceAccount per workload.

      The Deployment `reports` in namespace `finance` currently runs as `default`.
  - type: question
    question:
      questionType: command
      header: Create a ServiceAccount named `reports-sa` in `finance`.
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: serviceaccount
          aliases:
          - sa
        positionals:
        - index: 0
          value: reports-sa
        flags:
        - name: namespace
          short: n
          required: true
          value: finance
  - type: question
    question:
      questionType: command
      header: Make the Deployment `reports` in `finance` use the ServiceAccount `reports-sa`.
      hint: There is a `set` subcommand for this.
      correctAnswerInfo: '`kubectl set serviceaccount` edits `spec.template.spec.serviceAccountName`. Because that is a change
        to the Pod template, the Deployment rolls out new Pods; the field cannot be changed on a running Pod.'
      command:
        executable: kubectl
        subcommands:
        - name: set
        - name: serviceaccount
          aliases:
          - sa
        positionals:
        - index: 0
          regex: ^(deployments?|deploy)(/reports)?$
          description: type or type/name
        - index: 1
          regex: ^(reports|reports-sa)$
          description: name or ServiceAccount
        - index: 2
          required: false
          regex: ^reports-sa$
          description: ServiceAccount
        flags:
        - name: namespace
          short: n
          required: true
          value: finance
      cel:
      - name: Right Deployment and account
        expression: 'positionals.size() == 2 ? (positionals[0].endsWith(''/reports'') && positionals[1] == ''reports-sa'')
          : (positionals[1] == ''reports'' && positionals[2] == ''reports-sa'')'
        message: The command must name the Deployment and the new account
  - type: question
    question:
      questionType: single-line
      header: Which Pod spec field names the ServiceAccount (and so is what the command above changes in the template)?
      expectedAnswer: serviceAccountName
      cel: answer.trim().lowerAscii() in ['serviceaccountname', 'spec.serviceaccountname', 'spec.template.spec.serviceaccountname']
  - type: question
    question:
      questionType: single-line
      header: Can `serviceAccountName` of an already running Pod be changed in place? (yes/no)
      correctAnswerInfo: It is immutable on a Pod. Controllers like Deployments recreate Pods; a bare Pod must be deleted
        and created again.
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  explanation:
    elements:
    - type: context
      text: |
        One ServiceAccount per workload gives you three things: a distinct identity in audit logs, a place to attach exactly the permissions that workload needs,
        and the ability to revoke one workload's access without touching another.
    - type: references
      links:
      - url: https://kubernetes.io/docs/concepts/security/service-accounts/
        text: Service Accounts
      - url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
        text: Configure Service Accounts for Pods
- title: The default ServiceAccount
  category: ServiceAccounts
  hintsEnabled: true
  elements:
  - type: context
    text: |
      Part of the audit is looking for grants to `default`. This is the wide list of RoleBindings of all namespaces:
  - type: table
    style: terminal
    columns:
    - NAMESPACE
    - NAME
    - ROLE
    - AGE
    - USERS
    - GROUPS
    - SERVICEACCOUNTS
    rows:
    - - dev
      - dev-team
      - ClusterRole/edit
      - 40d
      - ''
      - dev-team
      - ''
    - - finance
      - reports-edit
      - ClusterRole/edit
      - 50d
      - ''
      - ''
      - finance/default
    - - shop
      - app-cm-reader
      - Role/cm-reader
      - 3d
      - ''
      - ''
      - shop/app
    - - prod
      - ops
      - ClusterRole/admin
      - 90d
      - jane
      - ''
      - ''
  - type: question
    question:
      questionType: single-line
      header: In which namespace is the `default` ServiceAccount given extra permissions?
      hint: Look at the last column.
      expectedAnswer: finance
      cel: answer.trim().lowerAscii() in ['finance']
  - type: question
    question:
      questionType: single-line
      header: Which role does it receive?
      expectedAnswer: edit
      cel: answer.trim().lowerAscii() in ['edit', 'clusterrole/edit']
  - type: question
    question:
      questionType: single-line
      header: Which Pods in that namespace inherit these permissions? (describe in a few words)
      hint: Who ends up with `default`?
      correctAnswerInfo: Every Pod that does not set `serviceAccountName`, including Pods created later by anyone with the
        right to create Pods there.
      expectedAnswer: all pods without a serviceaccountname
      cel: answer.lowerAscii().contains('all') || answer.lowerAscii().contains('every') || answer.lowerAscii().contains('without')
        || answer.lowerAscii().contains('any')
  explanation:
    elements:
    - type: context
      text: |
        Fix: create dedicated accounts, move the grants to them, delete the binding to `default`, and set `automountServiceAccountToken: false` on `default` so Pods that use it do not receive an API token at all.
    - type: references
      links:
      - url: https://kubernetes.io/docs/concepts/security/service-accounts/
        text: Service Accounts
- title: Disable Token Automounting
  category: ServiceAccounts
  hintsEnabled: true
  elements:
  - type: context
    text: |
      By default the kubelet mounts a token for the Pod's ServiceAccount into every container. An application that never calls the
      Kubernetes API does not need one, and a stolen token is a stolen identity.
  - type: question
    question:
      questionType: manifest
      header: Write the ServiceAccount `reports-sa` in namespace `finance` so that Pods using it do not get an API token mounted.
      hint: One boolean field at the top level of the object.
      manifestDefinitionId: serviceaccount-v1
      initialContent: |
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: reports-sa
          namespace: finance
      expectedFields:
      - path: metadata.name
        expectedValue: reports-sa
      - path: metadata.namespace
        expectedValue: finance
      - path: automountServiceAccountToken
        expectedValue: false
  - type: question
    question:
      questionType: command
      header: The existing ServiceAccount `default` in `finance` must stop mounting tokens too. Patch it.
      hint: A JSON merge patch with the same field.
      command:
        executable: kubectl
        subcommands:
        - name: patch
        - name: serviceaccount
          aliases:
          - sa
        positionals:
        - index: 0
          value: default
        flags:
        - name: namespace
          short: n
          required: true
          value: finance
        - name: patch
          short: p
          required: true
          regex: automountServiceAccountToken"?\s*:\s*false
  - type: question
    question:
      questionType: single-line
      header: 'A Pod sets `automountServiceAccountToken: true` while its ServiceAccount says `false`. Is a token mounted?
        (yes/no)'
      hint: Which of the two is more specific?
      correctAnswerInfo: The setting in the Pod spec overrides the one on the ServiceAccount.
      expectedAnswer: 'yes'
      cel: answer.trim().lowerAscii() in ['yes']
  explanation:
    elements:
    - type: context
      text: |
        Where to set it:

        - **ServiceAccount**: default for all Pods using that account.
        - **Pod spec**: wins over the ServiceAccount; use it to turn the token on for a single workload or off for a single Pod.

        Pods that really need the API should get a dedicated account with narrow RBAC, not the default.
    - type: references
      links:
      - url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
        text: Configure Service Accounts for Pods
- title: Verify That No Token Is Mounted
  category: ServiceAccounts
  hintsEnabled: true
  elements:
  - type: context
    text: |
      The token and CA certificate live in a well-known directory of every container that got one. The Pod `reports-0` in `finance` was
      restarted after the change. Look inside it.
  - type: question
    question:
      questionType: command
      header: List the files of the ServiceAccount directory `/var/run/secrets/kubernetes.io/serviceaccount/` inside the Pod
        `reports-0` in `finance`.
      hint: Anything after `--` is the command to run in the container.
      command:
        executable: kubectl
        strictness: permissive
        subcommands:
        - name: exec
        positionals:
        - index: 0
          value: reports-0
        flags:
        - name: namespace
          short: n
          required: true
          value: finance
      cel:
      - name: Lists the right directory
        expression: answer.contains('ls') && answer.contains('/var/run/secrets/kubernetes.io/serviceaccount')
        message: The command must list the token directory
  - type: table
    style: default
    columns:
    - STATE
    - OUTPUT
    rows:
    - - automount enabled
      - ca.crt  namespace  token
    - - automount disabled
      - 'ls: /var/run/secrets/kubernetes.io/serviceaccount/: No such file or directory'
  - type: question
    question:
      questionType: single-line
      header: Which file in that directory holds the credential that authenticates the Pod to the API server?
      expectedAnswer: token
      cel: answer.trim().lowerAscii() in ['token']
  - type: question
    question:
      questionType: single-line
      header: Which file is the certificate authority the Pod uses to verify the API server?
      expectedAnswer: ca.crt
      cel: answer.trim().lowerAscii() in ['ca.crt']
  explanation:
    elements:
    - type: context
      text: |
        Absence of the directory is the evidence you want: nothing in the container can talk to the API as the Pod. (A process can still reach the API server network address, but without credentials it is `system:anonymous`.)
    - type: references
      links:
      - url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
        text: Configure Service Accounts for Pods
- title: Tokens Today
  category: ServiceAccounts
  hintsEnabled: true
  elements:
  - type: context
    text: |
      Since Kubernetes 1.22 Pods receive a **projected** token: audience-bound, tied to the Pod, with an expiry, rotated by the kubelet.
      Since 1.24 no long-lived token Secret is created for a new ServiceAccount.

      To use an account from outside the cluster (a script, CI) you now request a token on demand.
  - type: question
    question:
      questionType: command
      header: Create a token for the ServiceAccount `reports-sa` in `finance` that is valid for 10 minutes.
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: token
        positionals:
        - index: 0
          value: reports-sa
        flags:
        - name: namespace
          short: n
          required: true
          value: finance
        - name: duration
          required: true
          regex: ^(10m|600s|10m0s)$
  - type: question
    question:
      questionType: single-line
      header: Which component rotates the projected token inside a running Pod?
      expectedAnswer: kubelet
      cel: answer.trim().lowerAscii() in ['kubelet']
  - type: question
    question:
      questionType: single-line
      header: Is a long-lived token Secret created automatically for a new ServiceAccount in v1.34? (yes/no)
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  - type: question
    question:
      questionType: single-line
      header: What is the default lifetime of a token requested with `kubectl create token` when no duration is given? (e.g.
        `1h`)
      correctAnswerInfo: The default is one hour. (Tokens injected into Pods are renewed by the kubelet; on clusters that
        still allow extended expiry for the transition from legacy tokens their `exp` can be much later, but they remain bound
        to the Pod.)
      expectedAnswer: 1h
      cel: answer.trim().lowerAscii() in ['1h', '1 hour', '3600', '3600s', '60m', '60 minutes', 'one hour']
  explanation:
    elements:
    - type: context
      text: |
        `kubectl create token` calls the `TokenRequest` API (`serviceaccounts/token`). The result is printed once and never stored, so there is nothing to leak from etcd and nothing to rotate except by waiting for expiry.
        Prefer short durations and the narrowest ServiceAccount for each use.
    - type: references
      links:
      - url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
        text: Configure Service Accounts for Pods
      - url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_token/
        text: kubectl create token
- title: Reading a Token
  category: ServiceAccounts
  hintsEnabled: true
  elements:
  - type: context
    text: |
      A ServiceAccount token is a JWT: three base64url parts separated by dots (`header.payload.signature`). The middle part is JSON that anybody who holds the token can read.
      A token was requested for the Pod `reports-0` with `kubectl create token reports-sa --bound-object-kind Pod --bound-object-name reports-0 -n finance`. This is its decoded payload:

      ```json
      {
        "aud": ["https://kubernetes.default.svc.cluster.local"],
        "exp": 1790003600,
        "iat": 1790000000,
        "iss": "https://kubernetes.default.svc.cluster.local",
        "kubernetes.io": {
          "namespace": "finance",
          "pod": { "name": "reports-0", "uid": "7e1f6c0e-5f0a-4a0e-8d41-3c9f0b3c2a11" },
          "serviceaccount": { "name": "reports-sa", "uid": "b7a0d7d4-2a3c-4b43-9c7f-7a1b6f1e5f20" }
        },
        "nbf": 1790000000,
        "sub": "system:serviceaccount:finance:reports-sa"
      }
      ```
  - type: question
    question:
      questionType: single-line
      header: Which user name does the API server see for requests made with this token?
      hint: The `sub` claim.
      expectedAnswer: system:serviceaccount:finance:reports-sa
      cel: answer.trim().lowerAscii() in ['system:serviceaccount:finance:reports-sa']
  - type: question
    question:
      questionType: single-line
      header: For how many seconds was the token valid when it was issued?
      hint: '`exp` minus `iat`.'
      expectedAnswer: '3600'
      cel: answer.trim().lowerAscii() in ['3600', '3600s', '1h', '1 hour']
  - type: question
    question:
      questionType: single-line
      header: Which claim tells you that the token stops working when the Pod `reports-0` is deleted?
      hint: Look for the object it is bound to.
      correctAnswerInfo: A Pod-bound token is invalidated when the Pod is deleted, which is a big improvement over the old
        Secret-based tokens that outlived their Pods.
      expectedAnswer: kubernetes.io
      cel: answer.trim().lowerAscii() in ['kubernetes.io', 'kubernetes.io.pod', 'pod', 'kubernetes.io/pod']
  - type: question
    question:
      questionType: command
      header: Print the decoded payload of the token file with `cut` (field 2, delimiter `.`) and `base64 -d`. Write option
        values as separate arguments, for example `-d .`.
      command:
        executable: cat
        positionals:
        - index: 0
          value: /var/run/secrets/kubernetes.io/serviceaccount/token
      modifiers:
      - type: Pipe
        pipe:
          command:
            executable: cut
            flags:
            - name: delimiter
              short: d
              required: true
              value: .
            - name: fields
              short: f
              required: true
              value: '2'
      - type: Pipe
        pipe:
          command:
            executable: base64
            flags:
            - name: decode
              short: d
              required: true
              boolean: true
  explanation:
    elements:
    - type: context
      text: |
        The signature stops the token being changed, not being read. `base64 -d` may complain about missing padding on the last bytes of a base64url string, but it still prints the JSON.
        Never paste real tokens into online decoders.
    - type: references
      links:
      - url: https://kubernetes.io/docs/concepts/security/service-accounts/
        text: Service Accounts
- title: Legacy Long-Lived Token Secrets
  category: ServiceAccounts
  hintsEnabled: true
  elements:
  - type: context
    text: |
      Before 1.24 every ServiceAccount got a Secret with a token that never expired. Older automation still creates them by hand. This one was found in `finance`:
  - type: manifest
    header: Secret reports-legacy-token
    content: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: reports-legacy-token
        namespace: finance
        annotations:
          kubernetes.io/service-account.name: reports-sa
      type: kubernetes.io/service-account-token
      data:
        ca.crt: LS0tLS1CRUdJTi...
        namespace: ZmluYW5jZQ==
        token: ZXlKaGJHY2lPaUpTVXpJMU5pSXNJ...
  - type: question
    question:
      questionType: single-line
      header: Which Secret `type` marks a ServiceAccount token Secret?
      expectedAnswer: kubernetes.io/service-account-token
      cel: answer.trim().lowerAscii() in ['kubernetes.io/service-account-token']
  - type: question
    question:
      questionType: single-line
      header: Which annotation links the Secret to its ServiceAccount?
      expectedAnswer: kubernetes.io/service-account.name
      cel: answer.trim().lowerAscii() in ['kubernetes.io/service-account.name']
  - type: question
    question:
      questionType: single-line
      header: Why is such a token discouraged? (one short phrase)
      hint: Compare with the projected token.
      expectedAnswer: it never expires
      cel: answer.lowerAscii().contains('expire') || answer.lowerAscii().contains('long-lived') || answer.lowerAscii().contains('long
        lived') || answer.lowerAscii().contains('forever') || answer.lowerAscii().contains('not bound')
  - type: question
    question:
      questionType: command
      header: Find all token Secrets of every namespace with a field selector on the Secret type.
      command:
        executable: kubectl
        subcommands:
        - name: get
        - name: secrets
          aliases:
          - secret
        flags:
        - name: all-namespaces
          short: A
          required: true
          boolean: true
        - name: field-selector
          required: true
          value: type=kubernetes.io/service-account-token
  - type: question
    question:
      questionType: command
      header: Delete the Secret `reports-legacy-token` in `finance`.
      command:
        executable: kubectl
        subcommands:
        - name: delete
        - name: secret
          aliases:
          - secrets
        positionals:
        - index: 0
          value: reports-legacy-token
        flags:
        - name: namespace
          short: n
          required: true
          value: finance
  explanation:
    elements:
    - type: context
      text: |
        Deleting the Secret does not affect Pods: they use projected tokens. It does break any external script that still uses the old token, which is the point of the clean-up.
        If a long-lived token is truly needed, create the Secret explicitly (as above) and track it; otherwise use `kubectl create token`.
    - type: references
      links:
      - url: https://kubernetes.io/docs/concepts/security/service-accounts/
        text: Service Accounts
      - url: https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/#manual-secret-management-for-serviceaccounts
        text: Manual Secret management for ServiceAccounts
- title: What a Stolen Token Can Do
  category: ServiceAccounts
  hintsEnabled: true
  elements:
  - type: context
    text: |
      An attacker with code execution in a Pod of `finance` reads the mounted token and talks to the API from inside the Pod:

      ```bash
      TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
      curl --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
        -H "Authorization: Bearer $TOKEN" \
        https://kubernetes.default.svc/api/v1/namespaces/finance/pods
      ```

      The response is:

      ```json
      {"kind":"Status","status":"Failure","message":"pods is forbidden: User \"system:serviceaccount:finance:reports-sa\" cannot list resource \"pods\" in API group \"\" in the namespace \"finance\"","reason":"Forbidden","code":403}
      ```
  - type: question
    question:
      questionType: single-line
      header: Which HTTP status code means the token was accepted but RBAC denied the action?
      hint: Authenticated, not authorized.
      expectedAnswer: '403'
      cel: answer.trim().lowerAscii() in ['403']
  - type: question
    question:
      questionType: single-line
      header: Which status code would the same request return with an expired token?
      expectedAnswer: '401'
      cel: answer.trim().lowerAscii() in ['401']
  - type: question
    question:
      questionType: single-line
      header: If the account were bound to `cluster-admin`, which status code would the request return?
      expectedAnswer: '200'
      cel: answer.trim().lowerAscii() in ['200']
  - type: question
    question:
      questionType: command
      header: From a machine with kubectl, list everything the token in `$TOKEN` may do in its own namespace `finance` (pass
        the token with the global flag).
      command:
        executable: kubectl
        subcommands:
        - name: auth
        - name: can-i
        flags:
        - name: list
          required: true
          boolean: true
        - name: token
          required: true
          regex: .+
        - name: namespace
          short: n
          required: true
          value: finance
  explanation:
    elements:
    - type: context
      text: |
        This is the quickest way to answer "what is the blast radius of this Pod being compromised?". Each denied request also shows up in the API server audit log with
        `responseStatus.code` 403 and the ServiceAccount user name, which is how a defender sees an attacker probing a stolen token.
    - type: references
      links:
      - url: https://kubernetes.io/docs/concepts/security/service-accounts/
        text: Service Accounts
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
- title: 'Capstone: Least Privilege for the reports App'
  category: Capstone
  hintsEnabled: true
  elements:
  - type: context
    text: |
      **Ticket SEC-2041**

      The `reports` application in namespace `finance` runs as the `default` ServiceAccount, which is bound to the ClusterRole `edit` through the
      ClusterRoleBinding `reports-edit`. The app only needs to:

      - read ConfigMaps in `finance` (`get`, `list`), and
      - read the single Secret `reports-db` in `finance` (`get`).

      Fix it:

      1. Create a dedicated ServiceAccount `reports-sa`.
      2. Write a Role `reports-reader` that grants only the needs above.
      3. Bind it to the new account.
      4. Switch the Deployment `reports` to the new account.
      5. Disable token automounting on `default`.
      6. Remove the old ClusterRoleBinding.
      7. Verify the result with `kubectl auth can-i` as the new account.
  - type: question
    question:
      questionType: command
      header: 'Step 1: create the ServiceAccount.'
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: serviceaccount
          aliases:
          - sa
        positionals:
        - index: 0
          value: reports-sa
        flags:
        - name: namespace
          short: n
          required: true
          value: finance
  - type: question
    question:
      questionType: manifest
      header: 'Step 2: write the Role `reports-reader` in `finance`.'
      hint: Two rules; one of them uses a field that narrows a rule to a named object.
      manifestDefinitionId: role-v1
      initialContent: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: reports-reader
          namespace: finance
        rules:
      expectedFields:
      - path: metadata.name
        expectedValue: reports-reader
      - path: metadata.namespace
        expectedValue: finance
      cel:
      - name: ConfigMaps readable
        expression: manifest.rules.exists(r, '' in r.apiGroups && 'configmaps' in r.resources && ['get','list'].all(v, v in
          r.verbs))
        message: ConfigMaps must be readable
      - name: One named Secret
        expression: manifest.rules.exists(r, 'secrets' in r.resources && has(r.resourceNames) && r.resourceNames == ['reports-db']
          && r.verbs == ['get'])
        message: The Secret rule must be limited to the one named Secret and to reading it
      - name: No other Secret access
        expression: manifest.rules.all(r, !('secrets' in r.resources) || (has(r.resourceNames) && r.resourceNames == ['reports-db']))
        message: No rule may reach other Secrets
      - name: Nothing else
        expression: manifest.rules.all(r, !('*' in r.resources) && !('*' in r.verbs) && r.resources.all(x, x in ['configmaps',
          'secrets']))
        message: The role must not grant anything beyond ConfigMaps and the one Secret
  - type: question
    question:
      questionType: command
      header: 'Step 3: bind the Role to the ServiceAccount with a RoleBinding named `reports-reader`.'
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: rolebinding
        positionals:
        - index: 0
          value: reports-reader
        flags:
        - name: role
          required: true
          value: reports-reader
        - name: serviceaccount
          required: true
          value: finance:reports-sa
        - name: namespace
          short: n
          required: true
          value: finance
  - type: question
    question:
      questionType: command
      header: 'Step 4: switch the Deployment `reports` to the new account.'
      command:
        executable: kubectl
        subcommands:
        - name: set
        - name: serviceaccount
          aliases:
          - sa
        positionals:
        - index: 0
          regex: ^(deployments?|deploy)(/reports)?$
        - index: 1
          regex: ^(reports|reports-sa)$
        - index: 2
          required: false
          regex: ^reports-sa$
        flags:
        - name: namespace
          short: n
          required: true
          value: finance
      cel:
      - name: Right Deployment and account
        expression: 'positionals.size() == 2 ? (positionals[0].endsWith(''/reports'') && positionals[1] == ''reports-sa'')
          : (positionals[1] == ''reports'' && positionals[2] == ''reports-sa'')'
        message: The command must name the Deployment and the new account
  - type: question
    question:
      questionType: command
      header: 'Step 5: stop `default` in `finance` from mounting tokens.'
      command:
        executable: kubectl
        subcommands:
        - name: patch
        - name: serviceaccount
          aliases:
          - sa
        positionals:
        - index: 0
          value: default
        flags:
        - name: namespace
          short: n
          required: true
          value: finance
        - name: patch
          short: p
          required: true
          regex: automountServiceAccountToken"?\s*:\s*false
  - type: question
    question:
      questionType: command
      header: 'Step 6: remove the old ClusterRoleBinding.'
      command:
        executable: kubectl
        subcommands:
        - name: delete
        - name: clusterrolebinding
        positionals:
        - index: 0
          value: reports-edit
  - type: question
    question:
      questionType: command
      header: 'Step 7a: verify that the new account can read the Secret `reports-db` in `finance` (use the `type/name` form).'
      command:
        executable: kubectl
        subcommands:
        - name: auth
        - name: can-i
        positionals:
        - index: 0
          value: get
        - index: 1
          regex: ^secrets?/reports-db$
        flags:
        - name: as
          required: true
          value: system:serviceaccount:finance:reports-sa
        - name: namespace
          short: n
          required: true
          value: finance
  - type: question
    question:
      questionType: single-line
      header: 'Step 7b: what does `kubectl auth can-i get secret/other-secret --as system:serviceaccount:finance:reports-sa
        -n finance` print?'
      correctAnswerInfo: The Secret rule is limited by `resourceNames`, so every other Secret is refused.
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ['no']
  - type: question
    question:
      questionType: command
      header: 'Step 7c: verify that the account cannot list Pods in `finance`.'
      command:
        executable: kubectl
        subcommands:
        - name: auth
        - name: can-i
        positionals:
        - index: 0
          value: list
        - index: 1
          oneOf:
          - pods
          - pod
          - po
        flags:
        - name: as
          required: true
          value: system:serviceaccount:finance:reports-sa
        - name: namespace
          short: n
          required: true
          value: finance
  - type: question
    question:
      questionType: command
      header: 'Step 7d: verify that the account has no access to ConfigMaps in another namespace, `default`.'
      command:
        executable: kubectl
        subcommands:
        - name: auth
        - name: can-i
        positionals:
        - index: 0
          value: get
        - index: 1
          oneOf:
          - configmaps
          - configmap
          - cm
        flags:
        - name: as
          required: true
          value: system:serviceaccount:finance:reports-sa
        - name: namespace
          short: n
          required: true
          value: default
  explanation:
    elements:
    - type: context
      text: |
        The finished state:

        | Before | After |
        |---|---|
        | Pods run as `default` | Pods run as `reports-sa` |
        | `default` bound to `edit` cluster-wide (ClusterRoleBinding) | `reports-sa` bound to a Role in `finance` only |
        | can read and change nearly everything, incl. all Secrets | can `get`/`list` ConfigMaps and `get` one Secret |
        | token mounted for everything using `default` | `default` has `automountServiceAccountToken: false` |

        Both directions of the verification matter: the app must still work (`yes` for what it needs) and the old reach must be gone (`no` everywhere else).
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
        text: Using RBAC Authorization
      - url: https://kubernetes.io/docs/concepts/security/service-accounts/
        text: Service Accounts
