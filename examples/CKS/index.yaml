apiVersion: v1alpha1
name: CKS
subdirs: []
sets:
  - name: "CKS: Cluster Setup"
    filename: cks-cluster-setup.yaml
    description: "Covers the CKS Cluster Setup domain: default-deny and scoped NetworkPolicies, auditing components with kube-bench against the CIS Benchmark, TLS-terminated Ingress, blocking access to cloud node metadata endpoints, and verifying platform binaries with checksums before deploying."
    tags:
      - Network Policy
      - CIS Benchmark
      - Ingress TLS
      - Node Metadata
      - Binary Verification
      - Hard
  - name: "CKS: Cluster Hardening"
    filename: cks-cluster-hardening.yaml
    description: "Covers the CKS Cluster Hardening domain: minimal-permission RBAC Roles and RoleBindings, dedicated least-privilege ServiceAccounts, disabling default ServiceAccount token automount, restricting anonymous API access, and upgrading kubeadm clusters to patch known vulnerabilities."
    tags:
      - RBAC
      - ServiceAccounts
      - API Server
      - kubeadm Upgrade
      - Hard
  - name: "CKS: System Hardening"
    filename: cks-system-hardening.yaml
    description: "Covers the CKS System Hardening domain: confining containers with seccomp and AppArmor profiles, ensuring container immutability at runtime with readOnlyRootFilesystem, and minimizing host OS footprint by purging unused packages."
    tags:
      - Seccomp
      - AppArmor
      - Immutability
      - Host Hardening
      - Hard
  - name: "CKS: Minimize Microservice Vulnerabilities"
    filename: cks-microservice-vulnerabilities.yaml
    description: "Covers the CKS Minimize Microservice Vulnerabilities domain: enforcing Pod Security Standards, replacing hardcoded Secrets in Deployments with secretKeyRef, sandboxing untrusted multi-tenant workloads with RuntimeClass, and enforcing strict mTLS Pod-to-Pod encryption with Istio."
    tags:
      - Pod Security Standards
      - Secrets
      - RuntimeClass
      - mTLS
      - Hard
  - name: "CKS: Supply Chain Security"
    filename: cks-supply-chain-security.yaml
    description: "Covers the CKS Supply Chain Security domain: minimizing base image footprint with multi-stage distroless Dockerfiles, restricting allowed image registries with OPA Gatekeeper, generating SBOMs and failing builds on vulnerabilities with Trivy, signing and verifying images with cosign, and static analysis with KubeLinter."
    tags:
      - Distroless
      - OPA Gatekeeper
      - Trivy
      - SBOM
      - cosign
      - KubeLinter
      - Hard
  - name: "CKS: Monitoring, Logging and Runtime Security"
    filename: cks-monitoring-logging-runtime-security.yaml
    description: "Covers the CKS Monitoring, Logging and Runtime Security domain: writing Falco rules for shell-spawn and filesystem-tampering detection, configuring Kubernetes audit policy to log Secrets access, and investigating a suspicious kubectl exec through raw audit logs."
    tags:
      - Falco
      - Audit Logs
      - Runtime Security
      - Investigation
      - Hard
  - name: "CKS (MCQ): AppArmor and seccomp"
    filename: cks-mcq-apparmor-seccomp.yaml
    description: "Multiple-choice only. How seccomp and AppArmor are specified to Kubernetes (Localhost paths and profile names, RuntimeDefault, Unconfined, kubelet seccompDefault), reading seccomp JSON and AppArmor profiles to predict what is blocked, missing-profile behavior, privileged containers, and how to verify what is really enforced."
    tags:
      - Multiple Choice
      - AppArmor
      - seccomp
      - Kernel Hardening
      - Hard
  - name: "CKS (MCQ): securityContext and Pod Security Standards"
    filename: cks-mcq-securitycontext-pss.yaml
    description: "Multiple-choice only. securityContext field placement and inheritance, runAsNonRoot and fsGroup behavior, read-only root filesystems and capabilities, judging whether Pod templates meet baseline or restricted (checked against Kubernetes' own evaluator), and configuring Pod Security Admission with labels, cluster defaults and exemptions."
    tags:
      - Multiple Choice
      - securityContext
      - Pod Security Standards
      - Pod Security Admission
      - Hard
  - name: "CKS (MCQ): Network Policies"
    filename: cks-mcq-network-policies.yaml
    description: "Multiple-choice only, every question with manifests. Default deny and allow, the policyTypes trap, AND versus OR selectors, DNS under egress deny, Service versus Pod ports, additive policies, replies and statefulness, and multi-namespace ingress and egress puzzles verified with an independent NetworkPolicy analyzer."
    tags:
      - Multiple Choice
      - Network Policy
      - Egress
      - Multi-Namespace
      - Hard
  - name: "CKS (Hands-On): AppArmor and seccomp"
    filename: cks-hands-on-apparmor-seccomp.yaml
    description: "No multiple choice. Exam-style practice for seccomp and AppArmor: write seccomp JSON and AppArmor profiles from a spec, load and distribute them across nodes, apply them to Pods and Deployments, fix Pods that fail to start, verify enforcement with /proc, crictl and kernel logs, and combine it all in two end-to-end capstone tasks."
    tags:
      - AppArmor
      - seccomp
      - Hands-On
      - Node Setup
      - Troubleshooting
      - Hard
  - name: "CKS (Hands-On): CSRs, Certificates and OpenSSL"
    filename: cks-hands-on-csr-openssl.yaml
    description: "No multiple choice. Create users through the Kubernetes CSR API and inspect cluster certificates: OpenSSL keys and CSRs, the CertificateSigningRequest object and signers, approving and extracting certificates, kubeconfig and RBAC for the new user, the lack of revocation, manual CA signing, reading SANs, issuers, expiry and key usage, verifying chains, kubeadm certificate renewal, and an end-to-end capstone."
    tags:
      - CSR
      - OpenSSL
      - Certificates
      - RBAC
      - kubeadm
      - Hands-On
      - Hard
  - name: "CKS (Hands-On): Falco and Runtime Security"
    filename: cks-hands-on-falco.yaml
    description: "No multiple choice. Operate Falco as a systemd service or DaemonSet, read alerts, configure outputs and priorities in falco.yaml, customise default rules with override syntax, write new rules from a spec, validate and test them, then trace an alert to the offending Pod and contain it. Written against Falco 0.45."
    tags:
      - Falco
      - Runtime Security
      - Hands-On
      - Rules
      - Incident Response
      - Hard
  - name: "CKS (Hands-On): Kubernetes Audit Logging"
    filename: cks-hands-on-audit-logging.yaml
    description: "No multiple choice. Write audit policies (levels, rule order, selectors, subresources, non-resource URLs), enable them in the kube-apiserver static Pod with the right flags, volumes and rotation, recover an API server that no longer starts, and find who did what in the audit log with grep and jq. Includes an end-to-end capstone."
    tags:
      - Audit Logging
      - Runtime Security
      - Hands-On
      - kube-apiserver
      - Troubleshooting
      - Hard
  - name: "CKS (Hands-On): Network Policies"
    filename: cks-hands-on-network-policies.yaml
    description: "No multiple choice. Write and read NetworkPolicies: how selection, isolation and the policyTypes defaults work, default deny and the DNS rule, the AND/OR selector trap, cross-namespace access, ports (named, ranges, Service vs container port), egress allow-lists, ipBlock and the metadata endpoint, containing a compromised Pod, debugging with describe and timeouts, a short Cilium section, and an end-to-end capstone."
    tags:
      - NetworkPolicy
      - Networking
      - Hands-On
      - Cluster Setup
      - Runtime Security
      - Hard
  - name: "CKS (Hands-On): RBAC and ServiceAccounts"
    filename: cks-hands-on-rbac-service-accounts.yaml
    description: "No multiple choice. Read, write and audit RBAC: Roles vs ClusterRoles, apiGroups and subresources, the binding scope matrix, subjects and ServiceAccount identities, imperative create role/rolebinding, auth can-i with --as and --list, finding cluster-admin and anonymous bindings, escalation paths (Pod creation, escalate/bind/impersonate, token minting), dedicated ServiceAccounts, disabling token automount, projected vs legacy tokens, and an end-to-end least-privilege capstone."
    tags:
      - RBAC
      - ServiceAccounts
      - Hands-On
      - Cluster Hardening
      - Hard
  - name: "CKS (Hands-On): Image Scanning with Trivy"
    filename: cks-hands-on-image-scanning-trivy.yaml
    description: "No multiple choice. Scan images with Trivy: filter by severity and fixability, gate builds with exit codes, write JSON reports and query them with jq, scan archives offline, choose scanners (vuln, secret, config), keep a .trivyignore, find the Pods that run vulnerable images and remove or fix them, with an audit-and-remediate capstone."
    tags:
      - Trivy
      - Image Scanning
      - Supply Chain
      - Hands-On
      - Hard
  - name: "CKS (Hands-On): SBOMs with Trivy and bom"
    filename: cks-hands-on-sbom.yaml
    description: "No multiple choice. Generate SPDX and CycloneDX SBOMs with Trivy and bom from images, archives and source directories, read package names, versions and purls, search many SBOMs for one library, compare releases, scan a stored SBOM for vulnerabilities, and combine it all in a Pod-to-decision capstone."
    tags:
      - SBOM
      - SPDX
      - CycloneDX
      - Trivy
      - bom
      - Supply Chain
      - Hands-On
      - Hard
  - name: "CKS (Hands-On): Image Footprint and Dockerfile Hardening"
    filename: cks-hands-on-dockerfile-hardening.yaml
    description: "No multiple choice. Write and fix real Dockerfiles: minimal and distroless base images, pinned tags and digests, non-root USER, multi-stage builds, package-manager hygiene, removing secrets and ADD, verifying a build with docker history and inspect, and hardening a whole Dockerfile in a capstone."
    tags:
      - Dockerfile
      - Distroless
      - Multi-Stage
      - Image Footprint
      - Supply Chain
      - Hands-On
      - Hard
  - name: "CKS (Hands-On): Static Analysis with kubesec and KubeLinter"
    filename: cks-hands-on-static-analysis.yaml
    description: "No multiple choice. Score manifests with kubesec and read its critical and advisory findings, lint with kube-linter, list checks, configure which checks run, suppress a finding with an annotation, fix Pod and Deployment manifests until they are clean, and review a directory of manifests."
    tags:
      - kubesec
      - KubeLinter
      - Static Analysis
      - Supply Chain
      - Hands-On
      - Hard
  - name: "CKS (Hands-On): Admission Control for Images"
    filename: cks-hands-on-admission-images.yaml
    description: "No multiple choice. Enable and configure ImagePolicyWebhook on the API server (flags, AdmissionConfiguration, webhook kubeconfig, fail-closed defaults, recovering a broken API server), then write ValidatingAdmissionPolicies and bindings that allow only trusted registries and digest-pinned images, roll them out safely and exempt system namespaces."
    tags:
      - ImagePolicyWebhook
      - ValidatingAdmissionPolicy
      - Admission Control
      - CEL
      - Supply Chain
      - Hands-On
      - Hard
  - name: "CKS (Hands-On): securityContext and Pod Security Admission"
    filename: cks-hands-on-securitycontext-psa.yaml
    description: "No multiple choice. Set users, groups, capabilities, privilege escalation and read-only root filesystems in Pod and container securityContexts, decide which Pod Security Standard a Pod meets, label namespaces for enforce, warn and audit, read and fix rejections, dry-run a label, diagnose empty Deployments, set cluster-wide defaults and exemptions, and harden a Deployment for a restricted namespace."
    tags:
      - securityContext
      - Pod Security Admission
      - Pod Security Standards
      - Immutability
      - Hands-On
      - Hard
  - name: "CKS (Hands-On): Secrets and Encryption at Rest"
    filename: cks-hands-on-secrets-encryption.yaml
    description: "No multiple choice. Create and consume Secrets safely, see what etcd really stores with etcdctl, write an EncryptionConfiguration, enable it on the API server, verify the k8s:enc prefix with hexdump, re-encrypt existing Secrets, rotate and remove keys, choose providers, and protect the cluster's Secrets end to end."
    tags:
      - Secrets
      - Encryption at Rest
      - etcd
      - EncryptionConfiguration
      - Hands-On
      - Hard
  - name: "CKS (Hands-On): Sandboxed Runtimes with RuntimeClass"
    filename: cks-hands-on-runtimeclass-sandbox.yaml
    description: "No multiple choice. Understand gVisor and Kata isolation, create RuntimeClass objects (handler, scheduling, overhead), run Pods and Deployments in them, verify the sandbox from inside, register the handler in containerd, troubleshoot sandbox failures, and require the class with a ValidatingAdmissionPolicy."
    tags:
      - RuntimeClass
      - gVisor
      - Kata Containers
      - Sandbox
      - Hands-On
      - Hard
  - name: "CKS (Hands-On): Pod-to-Pod Encryption (Cilium and Istio)"
    filename: cks-hands-on-pod-encryption.yaml
    description: "No multiple choice. Enable and verify Cilium WireGuard encryption, compare it with IPsec, require Cilium mutual authentication in a CiliumNetworkPolicy, put namespaces into an Istio mesh, require mTLS with PeerAuthentication at namespace and workload level, test enforcement from a non-mesh client, and authorize by workload identity."
    tags:
      - Cilium
      - WireGuard
      - Istio
      - mTLS
      - PeerAuthentication
      - Hands-On
      - Hard
  - name: "CKS (Hands-On): CIS Benchmarks with kube-bench"
    filename: cks-hands-on-kube-bench.yaml
    description: "No multiple choice. Run kube-bench for each target, read FAIL and WARN results and remediations, re-run single checks, and fix findings on the API server, controller manager, scheduler, etcd, kubelet and file permissions of a kubeadm cluster. Includes the manual policy checks and a report-to-green capstone."
    tags:
      - kube-bench
      - CIS Benchmark
      - Cluster Setup
      - kubeadm
      - Hands-On
      - Hard
  - name: "CKS (Hands-On): Ingress with TLS"
    filename: cks-hands-on-ingress-tls.yaml
    description: "No multiple choice. Create self-signed certificates with openssl, build kubernetes.io/tls Secrets, write Ingresses with spec.tls for one or several hosts, test with curl --resolve and --cacert, troubleshoot the fake-certificate fallback, understand HTTP to HTTPS redirects and rotate certificates in place."
    tags:
      - Ingress
      - TLS
      - openssl
      - curl
      - Cluster Setup
      - Hands-On
      - Hard
  - name: "CKS (Hands-On): API Server, Kubelet and Host Hardening"
    filename: cks-hands-on-api-kubelet-host-hardening.yaml
    description: "No multiple choice. Close anonymous access and AlwaysAllow on the API server, enable NodeRestriction and protected node labels, lock down the kubelet API (anonymous, webhook authentication and authorization, read-only port), read the live kubelet config, verify binaries with sha512sum, and minimize the host: services, packages, listening ports, ufw rules, users and SSH."
    tags:
      - API Server
      - Kubelet
      - NodeRestriction
      - Host Hardening
      - System Hardening
      - Cluster Hardening
      - Hands-On
      - Hard
  - name: "CKS (Hands-On): Upgrading a kubeadm Cluster"
    filename: cks-hands-on-kubeadm-upgrade.yaml
    description: "No multiple choice. Pick a safe target version and respect version skew, back up etcd, upgrade kubeadm, run upgrade plan and apply on the first control plane node, drain, upgrade kubelet and kubectl, restart and uncordon, upgrade workers with upgrade node, handle blocked drains, and verify nodes and certificates afterwards."
    tags:
      - kubeadm
      - Upgrade
      - Patching
      - Cluster Hardening
      - Hands-On
      - Hard
