apiVersion: v1alpha1
name: CKS
subdirs: []
sets:
  - name: "CKS: Cluster Setup"
    filename: cks-cluster-setup.yaml
    description: "Covers the CKS Cluster Setup domain: default-deny and scoped NetworkPolicies, auditing components with kube-bench against the CIS Benchmark, TLS-terminated Ingress, blocking access to cloud node metadata endpoints, and verifying platform binaries with checksums before deploying."
    tags:
      - Network Policy
      - CIS Benchmark
      - Ingress TLS
      - Node Metadata
      - Binary Verification
      - Hard
  - name: "CKS: Cluster Hardening"
    filename: cks-cluster-hardening.yaml
    description: "Covers the CKS Cluster Hardening domain: minimal-permission RBAC Roles and RoleBindings, dedicated least-privilege ServiceAccounts, disabling default ServiceAccount token automount, restricting anonymous API access, and upgrading kubeadm clusters to patch known vulnerabilities."
    tags:
      - RBAC
      - ServiceAccounts
      - API Server
      - kubeadm Upgrade
      - Hard
  - name: "CKS: System Hardening"
    filename: cks-system-hardening.yaml
    description: "Covers the CKS System Hardening domain: confining containers with seccomp and AppArmor profiles, ensuring container immutability at runtime with readOnlyRootFilesystem, and minimizing host OS footprint by purging unused packages."
    tags:
      - Seccomp
      - AppArmor
      - Immutability
      - Host Hardening
      - Hard
  - name: "CKS: Minimize Microservice Vulnerabilities"
    filename: cks-microservice-vulnerabilities.yaml
    description: "Covers the CKS Minimize Microservice Vulnerabilities domain: enforcing Pod Security Standards, replacing hardcoded Secrets in Deployments with secretKeyRef, sandboxing untrusted multi-tenant workloads with RuntimeClass, and enforcing strict mTLS Pod-to-Pod encryption with Istio."
    tags:
      - Pod Security Standards
      - Secrets
      - RuntimeClass
      - mTLS
      - Hard
  - name: "CKS: Supply Chain Security"
    filename: cks-supply-chain-security.yaml
    description: "Covers the CKS Supply Chain Security domain: minimizing base image footprint with multi-stage distroless Dockerfiles, restricting allowed image registries with OPA Gatekeeper, generating SBOMs and failing builds on vulnerabilities with Trivy, signing and verifying images with cosign, and static analysis with KubeLinter."
    tags:
      - Distroless
      - OPA Gatekeeper
      - Trivy
      - SBOM
      - cosign
      - KubeLinter
      - Hard
  - name: "CKS: Monitoring, Logging and Runtime Security"
    filename: cks-monitoring-logging-runtime-security.yaml
    description: "Covers the CKS Monitoring, Logging and Runtime Security domain: writing Falco rules for shell-spawn and filesystem-tampering detection, configuring Kubernetes audit policy to log Secrets access, and investigating a suspicious kubectl exec through raw audit logs."
    tags:
      - Falco
      - Audit Logs
      - Runtime Security
      - Investigation
      - Hard
  - name: "CKS (MCQ): AppArmor and seccomp"
    filename: cks-mcq-apparmor-seccomp.yaml
    description: "Multiple-choice only. How seccomp and AppArmor are specified to Kubernetes (Localhost paths and profile names, RuntimeDefault, Unconfined, kubelet seccompDefault), reading seccomp JSON and AppArmor profiles to predict what is blocked, missing-profile behavior, privileged containers, and how to verify what is really enforced."
    tags:
      - Multiple Choice
      - AppArmor
      - seccomp
      - Kernel Hardening
      - Hard
  - name: "CKS (MCQ): securityContext and Pod Security Standards"
    filename: cks-mcq-securitycontext-pss.yaml
    description: "Multiple-choice only. securityContext field placement and inheritance, runAsNonRoot and fsGroup behavior, read-only root filesystems and capabilities, judging whether Pod templates meet baseline or restricted (checked against Kubernetes' own evaluator), and configuring Pod Security Admission with labels, cluster defaults and exemptions."
    tags:
      - Multiple Choice
      - securityContext
      - Pod Security Standards
      - Pod Security Admission
      - Hard
  - name: "CKS (MCQ): Network Policies"
    filename: cks-mcq-network-policies.yaml
    description: "Multiple-choice only, every question with manifests. Default deny and allow, the policyTypes trap, AND versus OR selectors, DNS under egress deny, Service versus Pod ports, additive policies, replies and statefulness, and multi-namespace ingress and egress puzzles verified with an independent NetworkPolicy analyzer."
    tags:
      - Multiple Choice
      - Network Policy
      - Egress
      - Multi-Namespace
      - Hard
  - name: "CKS (Hands-On): AppArmor and seccomp"
    filename: cks-hands-on-apparmor-seccomp.yaml
    description: "No multiple choice. Exam-style practice for seccomp and AppArmor: write seccomp JSON and AppArmor profiles from a spec, load and distribute them across nodes, apply them to Pods and Deployments, fix Pods that fail to start, verify enforcement with /proc, crictl and kernel logs, and combine it all in two end-to-end capstone tasks."
    tags:
      - AppArmor
      - seccomp
      - Hands-On
      - Node Setup
      - Troubleshooting
      - Hard
  - name: "CKS (Hands-On): CSRs, Certificates and OpenSSL"
    filename: cks-hands-on-csr-openssl.yaml
    description: "No multiple choice. Create users through the Kubernetes CSR API and inspect cluster certificates: OpenSSL keys and CSRs, the CertificateSigningRequest object and signers, approving and extracting certificates, kubeconfig and RBAC for the new user, the lack of revocation, manual CA signing, reading SANs, issuers, expiry and key usage, verifying chains, kubeadm certificate renewal, and an end-to-end capstone."
    tags:
      - CSR
      - OpenSSL
      - Certificates
      - RBAC
      - kubeadm
      - Hands-On
      - Hard
  - name: "CKS (Hands-On): Falco and Runtime Security"
    filename: cks-hands-on-falco.yaml
    description: "No multiple choice. Operate Falco as a systemd service or DaemonSet, read alerts, configure outputs and priorities in falco.yaml, customise default rules with override syntax, write new rules from a spec, validate and test them, then trace an alert to the offending Pod and contain it. Written against Falco 0.45."
    tags:
      - Falco
      - Runtime Security
      - Hands-On
      - Rules
      - Incident Response
      - Hard
