apiVersion: v1alpha1
name: 'CKS (Hands-On): Pod-to-Pod Encryption (Cilium and Istio)'
k8sVersion: 1.34.0
timing:
  enabled: true
  limitSeconds: 7200
introduction:
  elements:
  - type: context
    text: |
      Hands-on practice with **Pod-to-Pod encryption** for the CKS *Minimize Microservice Vulnerabilities* domain: enable and verify Cilium
      transparent encryption (WireGuard, IPsec), require Cilium mutual authentication in a policy, join namespaces to an Istio mesh and require mTLS
      with `PeerAuthentication`, test enforcement and authorize by workload identity. There is no multiple choice.

      **Lab environment**

      - You are `root` on the control-plane node of a kubeadm cluster (Kubernetes 1.34, containerd). `kubectl` and `helm` use the admin credentials. Cilium is the CNI
        (Helm release `cilium` in `kube-system`); Istio is installed with `istiod` in `istio-system`.
      - Namespaces `shop`, `payments` and `legacy` exist; each scenario states what runs in them.

      **How answers are checked**

      - *Manifests* for Istio and Cilium custom resources are checked for their shape and for what they *mean* (mode, selector, principals). *Commands* are
        checked structurally (flag order is free, `--set` values may come in any order); short answers accept common spellings.

      Exam content is under NDA: this is practice for the common patterns, not a prediction.
  - type: references
    links:
    - url: https://docs.cilium.io/en/stable/security/network/encryption-wireguard/
      text: 'Cilium: WireGuard Transparent Encryption'
    - url: https://docs.cilium.io/en/stable/network/servicemesh/mutual-authentication/mutual-authentication/
      text: 'Cilium: Mutual Authentication'
    - url: https://istio.io/latest/docs/reference/config/security/peer_authentication/
      text: 'Istio: PeerAuthentication'
    - url: https://istio.io/latest/docs/concepts/security/#mutual-tls-authentication
      text: 'Istio: Mutual TLS authentication'
    - url: https://training.linuxfoundation.org/certification/certified-kubernetes-security-specialist-cks/
      text: CKS Domains and Competencies
