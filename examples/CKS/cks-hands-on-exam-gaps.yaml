apiVersion: v1alpha1
name: 'CKS (Hands-On): Gap Pack'
k8sVersion: 1.34.0
timing:
  enabled: true
  limitSeconds: 5400
introduction:
  elements:
  - type: context
    text: |
      One set for the exam tasks that the other hands-on sets only touch on. Work through it in one go after the
      main sets:

      - **Docker daemon**: a user in the `docker` group, socket ownership, the Docker API on a TCP port
      - **ServiceAccount tokens**: automount off, then a token mounted by hand as a read-only projected volume
      - **Falco**: a rule for `/dev/mem`, from the alert to the Pod, then scale its Deployment to zero
      - **Cilium**: one policy with mutual authentication for Pods and an unauthenticated rule for the host
      - **Image and Pod user**: `USER nobody` in the Dockerfile and a Deployment that overrides it
      - **SBOM**: find the image that ships a library, remove its container from a multi-container Deployment

      **Lab environment**

      - You are `root` on `controlplane` of a kubeadm cluster (Kubernetes 1.34, containerd). Each scenario names the node
        it runs on: `node01` runs Falco **0.45** as the systemd service `falco-modern-bpf`, and `build-node` is a CI host
        with Docker Engine installed from the docker-ce packages.
      - Cilium is the CNI. It was installed with mutual authentication enabled (SPIRE).
      - `bom` and `kubectl` are on `controlplane`.

      **How answers are checked**

      - *Manifests* are validated against the Kubernetes schema, then for what they mean (key order and style are free).
      - *Commands* are checked structurally (flag order is free).
      - *Config snippets* (systemd units, Falco rules) are checked for the required lines and values.

      Exam content is under NDA: this is practice for the common patterns, not a prediction.
  - type: references
    links:
    - url: https://training.linuxfoundation.org/certification/certified-kubernetes-security-specialist-cks/
      text: CKS Domains and Competencies
    - url: https://docs.docker.com/engine/security/
      text: Docker Engine security
    - url: https://kubernetes.io/docs/concepts/storage/projected-volumes/
      text: Projected Volumes
    - url: https://falco.org/docs/concepts/rules/
      text: Falco rules
    - url: https://docs.cilium.io/en/stable/network/servicemesh/mutual-authentication/mutual-authentication/
      text: 'Cilium: Mutual Authentication'
    - url: https://github.com/kubernetes-sigs/bom
      text: kubernetes-sigs/bom
