apiVersion: v1alpha1
name: 'CKS (Hands-On): Secrets and Encryption at Rest'
k8sVersion: 1.34.0
timing:
  enabled: true
  limitSeconds: 7200
introduction:
  elements:
  - type: context
    text: |
      Hands-on practice with **Secrets and encryption at rest** for the CKS *Minimize Microservice Vulnerabilities* domain: create and consume
      Secrets safely, see what etcd really stores, write an `EncryptionConfiguration`, enable it on the API server, re-encrypt existing Secrets,
      verify the result from etcd, and rotate or remove keys. There is no multiple choice.

      **Lab environment**

      - You are `root` on the control-plane node of a kubeadm cluster (Kubernetes 1.34, containerd, stacked etcd). `kubectl` uses the admin
        credentials; `etcdctl` is installed, and the etcd certificates are in `/etc/kubernetes/pki/etcd`.
      - The kube-apiserver is a static Pod in `/etc/kubernetes/manifests`. Keys shown are for practice only.

      **How answers are checked**

      - *Manifests* are validated against the Kubernetes schema and then for what they *mean*. *Configuration files* are checked for the
        required settings and their order (provider and key order matters).
      - *Commands* are checked structurally (flag order is free, long and short forms accepted, pipelines through `base64` and `hexdump` are
        part of the answer); short answers accept common spellings.

      Exam content is under NDA: this is practice for the common patterns, not a prediction.
  - type: references
    links:
    - url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
      text: Encrypting Confidential Data at Rest
    - url: https://kubernetes.io/docs/concepts/configuration/secret/
      text: Secrets
    - url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
      text: Good practices for Kubernetes Secrets
    - url: https://kubernetes.io/docs/tasks/administer-cluster/kms-provider/
      text: Using a KMS provider for data encryption
    - url: https://training.linuxfoundation.org/certification/certified-kubernetes-security-specialist-cks/
      text: CKS Domains and Competencies
manifestDefinitions:
- id: pod-v1
  kind: Pod
  apiVersion: v1
  autoLoad: true
scenarios:
- title: Base64 Is Not Encryption
  category: Secrets Basics
  hintsEnabled: true
  elements:
  - type: context
    text: |
      The Secret `db-creds` in namespace `shop` was created by a colleague who says "secrets are encrypted, so it is safe to let the whole
      team run `kubectl get secret -o yaml`". The `data` fields look like random text.
  - type: question
    question:
      questionType: command
      header: 'Print the decoded value of the key `password` of Secret `db-creds` in `shop`: get the Secret with JSONPath
        output of that key and pipe it into the decoder.'
      hint: The value is not secret from anybody who can read the object; the encoding is reversible with a standard tool.
      correctAnswerInfo: '`kubectl get secret db-creds -n shop -o jsonpath=''{.data.password}'' | base64 -d`. Base64 only
        lets binary values travel in JSON/YAML.'
      command:
        executable: kubectl
        subcommands:
        - name: get
        - name: secret
          aliases:
          - secrets
        positionals:
        - index: 0
          value: db-creds
        flags:
        - name: namespace
          short: n
          required: true
          value: shop
        - name: output
          short: o
          required: true
          regex: ^jsonpath.*\.data\.password
      modifiers:
      - type: Pipe
        pipe:
          command:
            executable: base64
            strictness: permissive
            flags:
            - name: decode
              short: d
              required: true
              boolean: true
  - type: table
    style: terminal
    columns:
    - OUTPUT
    rows:
    - - S3cr3t-Pa55
  - type: question
    question:
      questionType: single-line
      header: Which API verbs on `secrets` allow a user to read the values? Name the three verbs separated by commas.
      hint: Single object, collection, and stream.
      correctAnswerInfo: 'Restrict these verbs with RBAC (and use `resourceNames` where possible). Encryption at rest does
        NOT protect against a user with these verbs: the API server decrypts for authorized callers.'
      expectedAnswer: get,list,watch
      cel: answer.trim().lowerAscii() in ["get,list,watch", "get, list, watch", "get list watch", "list, get, watch", "get,watch,list",
        "list,get,watch", "watch,list,get"]
  explanation:
    elements:
    - type: context
      text: |
        Secrets in the API are protected by **RBAC** (who can read them through the API) and, optionally, by **encryption at rest** (what is
        stored in etcd and its backups). The default is neither encrypted nor hashed: `etcd` holds the same base64 value.
    - type: references
      links:
      - url: https://kubernetes.io/docs/concepts/configuration/secret/
        text: Secrets
      - url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
        text: Good practices for Kubernetes Secrets
- title: Create Secrets the Right Way
  category: Secrets Basics
  hintsEnabled: true
  elements:
  - type: context
    text: |
      Create the credentials for the `shop` application without writing them into a YAML file that might be committed to Git.
  - type: question
    question:
      questionType: command
      header: Create a generic Secret `db-creds` in namespace `shop` with the keys `username=shopapp` and `password=S3cr3t-Pa55`
        from literal values.
      hint: One flag per key, repeated.
      correctAnswerInfo: The shell history keeps the literal values; for real credentials prefer `--from-file` with a protected
        file, or generate the Secret from a vault.
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: secret
        - name: generic
        positionals:
        - index: 0
          value: db-creds
        flags:
        - name: namespace
          short: n
          required: true
          value: shop
        - name: from-literal
          required: true
          repeatable: true
      cel: flags['from-literal'].size() == 2 && 'username=shopapp' in flags['from-literal'] && 'password=S3cr3t-Pa55' in flags['from-literal']
  - type: question
    question:
      questionType: command
      header: The Pods pull images from the private registry `registry.local`. Create an image pull Secret `regcred` in `shop`
        for user `ci`, password `ci-token`, server `registry.local`.
      hint: There is a specialised Secret subtype for registry credentials.
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: secret
        - name: docker-registry
        positionals:
        - index: 0
          value: regcred
        flags:
        - name: namespace
          short: n
          required: true
          value: shop
        - name: docker-server
          required: true
          value: registry.local
        - name: docker-username
          required: true
          value: ci
        - name: docker-password
          required: true
          value: ci-token
  - type: question
    question:
      questionType: single-line
      header: Which `type` value does this kind of Secret get?
      hint: 'Look at `kubectl get secret regcred -o yaml`: the data key is `.dockerconfigjson`.'
      expectedAnswer: kubernetes.io/dockerconfigjson
      cel: answer.trim() in ["kubernetes.io/dockerconfigjson"]
  explanation:
    elements:
    - type: context
      text: |
        Secret types: `Opaque` (default), `kubernetes.io/dockerconfigjson` (registry credentials, used by `imagePullSecrets`),
        `kubernetes.io/tls` (certificate and key), `kubernetes.io/service-account-token`, `kubernetes.io/basic-auth`, `kubernetes.io/ssh-auth`.
    - type: references
      links:
      - url: https://kubernetes.io/docs/tasks/configmap-secret/managing-secret-using-kubectl/
        text: Managing Secrets using kubectl
      - url: https://kubernetes.io/docs/concepts/configuration/secret/
        text: Secrets
- title: Consume a Secret as a Read-Only File
  category: Secrets Basics
  hintsEnabled: true
  elements:
  - type: context
    text: |
      Pod `shop-api` in `shop` (image `registry.local/shop/api:2.4`) needs the Secret `db-creds` as files below `/etc/db`. Anybody who gets
      into the container must not be able to modify them, and they must not be readable by others. The application runs as the non-root user `10001`.
      Environment variables are not allowed because they appear in `/proc`, crash dumps and `kubectl describe`.
  - type: question
    question:
      questionType: manifest
      header: Write the Pod manifest.
      hint: A volume of the secret kind, a read-only mount, a mode on the volume and a way for the non-root user to read files
        owned by root. YAML octal like 0440 becomes decimal 288 once parsed.
      correctAnswerInfo: '`defaultMode: 0440` is 288 in decimal. Files in secret volumes are kept in a tmpfs on the node (never
        written to disk) and are updated when the Secret changes, which environment variables cannot do.'
      manifestDefinitionId: pod-v1
      initialContent: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: shop-api
          namespace: shop
        spec:
          containers:
            - name: api
              image: registry.local/shop/api:2.4
      expectedFields:
      - path: metadata.name
        expectedValue: shop-api
      cel:
      - name: Secret volume
        expression: manifest.spec.volumes.exists(v, has(v.secret) && v.secret.secretName == 'db-creds')
        message: The Secret must be provided as a volume
      - name: Mounted read-only
        expression: manifest.spec.containers[0].volumeMounts.exists(m, m.mountPath == '/etc/db' && has(m.readOnly) && m.readOnly
          == true)
        message: The mount must be at /etc/db and read-only
      - name: Owner and group only
        expression: manifest.spec.volumes.exists(v, has(v.secret) && has(v.secret.defaultMode) && v.secret.defaultMode ==
          288)
        message: File permissions must allow read for owner and group only, not for others (mode in decimal as stored by the
          API)
      - name: Readable for the app
        expression: has(manifest.spec.securityContext) && has(manifest.spec.securityContext.fsGroup) && manifest.spec.securityContext.fsGroup
          > 0 && ((has(manifest.spec.securityContext.runAsUser) && manifest.spec.securityContext.runAsUser == 10001) || manifest.spec.containers[0].securityContext.runAsUser
          == 10001)
        message: The application user must be able to read the files through a group
      - name: No env
        expression: '!has(manifest.spec.containers[0].env) && !has(manifest.spec.containers[0].envFrom)'
        message: No environment variables for the Secret
  - type: question
    question:
      questionType: single-line
      header: Suppose the mode were 0400 and the files stay owned by root. Could the application running as user 10001 read
        them? (yes/no)
      hint: Who owns the files, and who is allowed to read them with this mode?
      correctAnswerInfo: Secret files are owned by root. With `fsGroup` set, the kubelet makes the files group-owned by that
        GID and adds group read permission, so 0400 effectively becomes 0440 and the non-root application can read them through
        its supplemental group. Without it, a non-root app cannot read a 0400 secret file.
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ["no"]
  explanation:
    elements:
    - type: context
      text: |
        Secrets as files beat environment variables: they are not inherited by child processes, do not leak through `docker inspect`-style tooling or
        logs of environment dumps, and they can be updated without restarting. Add `automountServiceAccountToken: false` where the Pod needs no API access.
    - type: references
      links:
      - url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
        text: Good practices for Kubernetes Secrets
      - url: https://kubernetes.io/docs/concepts/storage/volumes/#secret
        text: Secret volumes
- title: Find and Extract the Secret a Pod Uses
  category: Secrets Basics
  hintsEnabled: true
  elements:
  - type: context
    text: |
      A typical task: "find the Secret used by the Pod `billing` in namespace `finance` and write its decoded `password` value to `/opt/db-pass.txt`". The Pod reads
      the credential from an environment variable. This is the relevant part of its spec:
  - type: manifest
    header: kubectl get pod billing -n finance -o yaml (excerpt)
    content: |
      spec:
        containers:
          - name: app
            image: registry.local/finance/billing:3.1
            env:
              - name: DB_PASS
                valueFrom:
                  secretKeyRef:
                    name: db-pass
                    key: password
            volumeMounts:
              - name: certs
                mountPath: /etc/certs
                readOnly: true
        volumes:
          - name: certs
            secret:
              secretName: billing-tls
  - type: question
    question:
      questionType: single-line
      header: Which Secret supplies the environment variable `DB_PASS`?
      hint: Look under valueFrom, not under volumes.
      expectedAnswer: db-pass
      cel: answer.trim().lowerAscii() in ["db-pass"]
  - type: question
    question:
      questionType: command
      header: 'Write the decoded `password` of that Secret to `/opt/db-pass.txt`: get it with JSONPath, decode, and redirect
        to the file.'
      hint: 'Three parts: read the field, decode it, write to the file.'
      correctAnswerInfo: 'A Go template does the decoding inside kubectl: `-o go-template=''{{.data.password | base64decode}}''`.
        Use the bytes exactly: `echo` adds a newline, `printf` and `-n` do not.'
      command:
        executable: kubectl
        subcommands:
        - name: get
        - name: secret
          aliases:
          - secrets
        positionals:
        - index: 0
          value: db-pass
        flags:
        - name: namespace
          short: n
          required: true
          value: finance
        - name: output
          short: o
          required: true
          regex: ^jsonpath.*\.data\.password
      modifiers:
      - type: Pipe
        pipe:
          command:
            executable: base64
            strictness: permissive
            flags:
            - name: decode
              short: d
              required: true
              boolean: true
      - type: Redirect
        redirect:
          type: '>'
          value: /opt/db-pass.txt
  - type: question
    question:
      questionType: command
      header: The other Secret is mounted as files. Print the file `tls.key` from the running container by executing cat in
        Pod `billing` of namespace `finance` (the mount path is in the excerpt).
      hint: kubectl exec with the command after a double dash; the key is a file below the mount path.
      command:
        executable: kubectl
        strictness: permissive
        subcommands:
        - name: exec
        positionals:
        - index: 0
          value: billing
        flags:
        - name: namespace
          short: n
          required: true
          value: finance
      cel: answer.contains('cat /etc/certs/tls.key')
  explanation:
    elements:
    - type: context
      text: |
        Two ways to read what a Pod uses: from the API (find the Secret name in `env[].valueFrom.secretKeyRef` or `volumes[].secret.secretName`, then `kubectl get secret -o jsonpath | base64 -d`) or from
        inside the container (`kubectl exec ... cat <mounted file>` or `env`). Reading from the API needs the `get` permission on the Secret; exec needs `pods/exec`.
    - type: references
      links:
      - url: https://kubernetes.io/docs/concepts/configuration/secret/
        text: Secrets
      - url: https://kubernetes.io/docs/tasks/configmap-secret/managing-secret-using-kubectl/
        text: Managing Secrets using kubectl
- title: From Environment Variable to Volume
  category: Secrets Basics
  hintsEnabled: true
  elements:
  - type: context
    text: |
      The security review asks to stop passing the database password as an environment variable. Change Pod `billing` in namespace `finance`: the Secret `db-pass` must be
      mounted read-only at `/etc/db-pass` as files, and the `DB_PASS` variable must go.
  - type: question
    question:
      questionType: manifest
      header: Write the Pod manifest.
      hint: Remove the variable and add a volume plus a mount that refer to each other by name.
      correctAnswerInfo: The application now reads the file `/etc/db-pass/password`. The application code must change too,
        otherwise it will not find its password.
      manifestDefinitionId: pod-v1
      initialContent: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: billing
          namespace: finance
        spec:
          containers:
            - name: app
              image: registry.local/finance/billing:3.1
              env:
                - name: DB_PASS
                  valueFrom:
                    secretKeyRef:
                      name: db-pass
                      key: password
      expectedFields:
      - path: metadata.name
        expectedValue: billing
      cel:
      - name: No secret in env
        expression: '!manifest.spec.containers.exists(c, has(c.env) && c.env.exists(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef)))'
        message: The Secret must not be exposed through environment variables
      - name: Volume
        expression: manifest.spec.volumes.exists(v, has(v.secret) && v.secret.secretName == 'db-pass')
        message: The Secret must be provided as a volume
      - name: Mount
        expression: manifest.spec.containers[0].volumeMounts.exists(m, m.mountPath == '/etc/db-pass' && has(m.readOnly) &&
          m.readOnly == true && manifest.spec.volumes.exists(v, v.name == m.name && has(v.secret)))
        message: The volume must be mounted read-only at the given path
  - type: question
    question:
      questionType: single-line
      header: Which field of the Secret reference would you set to `true` if the Pod should still start when the Secret does
        not exist?
      hint: A boolean next to name and key.
      expectedAnswer: optional
      cel: answer.trim().lowerAscii() in ["optional"]
  - type: question
    question:
      questionType: single-line
      header: Which field, set on the Secret object itself, makes its data impossible to change later (and improves API server
        performance)?
      hint: A top-level field of the Secret.
      expectedAnswer: immutable
      cel: 'answer.trim().lowerAscii() in ["immutable", "immutable: true"]'
  explanation:
    elements:
    - type: context
      text: |
        `env[].valueFrom.secretKeyRef` takes one key; `envFrom[].secretRef` takes all keys. Both are snapshots at container start: a changed Secret reaches a running container only through a volume.
        Indirect access matters too: anyone who can create Pods in a namespace can mount any Secret there, even without `get` on Secrets; see the RBAC set (escalation through Pod creation).
    - type: references
      links:
      - url: https://kubernetes.io/docs/concepts/configuration/secret/
        text: Secrets
- title: Look Into etcd
  category: Encryption at Rest
  hintsEnabled: true
  elements:
  - type: context
    text: |
      To judge whether encryption at rest is active you must look where the API server stores data: **etcd**. On the control-plane node,
      `etcdctl` is installed and the etcd client certificates are in `/etc/kubernetes/pki/etcd`. The etcd member listens on
      `https://127.0.0.1:2379`. All keys are stored under `/registry/<resource>/<namespace>/<name>`. Any valid client pair works: the etcd server pair `server.crt`/`server.key`, or the API server's own client pair `apiserver-etcd-client.crt`/`.key` in `/etc/kubernetes/pki` (the paths are in the kube-apiserver manifest as `--etcd-certfile` and `--etcd-keyfile`).
  - type: question
    question:
      questionType: command
      header: Read the raw stored value of Secret `db-creds` in namespace `shop` from etcd.
      hint: 'The key path follows the pattern from the text. Four connection flags are needed: endpoint, CA, client certificate,
        client key.'
      correctAnswerInfo: Without `--print-value-only` etcdctl prints the key and then the value. Pipe through `hexdump -C`
        for readability of binary content.
      command:
        executable: etcdctl
        subcommands:
        - name: get
        positionals:
        - index: 0
          value: /registry/secrets/shop/db-creds
        flags: &id001
        - name: endpoints
          required: true
          value: https://127.0.0.1:2379
        - name: cacert
          required: true
          value: /etc/kubernetes/pki/etcd/ca.crt
        - name: cert
          required: true
          regex: ^/etc/kubernetes/pki/(etcd/server|apiserver-etcd-client)\.crt$
        - name: key
          required: true
          regex: ^/etc/kubernetes/pki/(etcd/server|apiserver-etcd-client)\.key$
  - type: manifest
    header: Output (non-printable bytes omitted)
    content: |
      /registry/secrets/shop/db-creds
      k8s

      v1Secret

      db-creds
      shop"
      ...
      password
      S3cr3t-Pa55
  - type: question
    question:
      questionType: single-line
      header: What do you conclude about the Secret from seeing its password in clear text in etcd?
      hint: What would an encrypted value look like?
      expectedAnswer: not encrypted
      cel: answer.trim().lowerAscii() in ["not encrypted", "unencrypted", "plaintext", "plain text", "in clear text", "clear
        text", "no"]
  explanation:
    elements:
    - type: context
      text: |
        Anyone with access to etcd, its data directory or a backup can read every Secret of the cluster when encryption is not enabled. That is a reason
        to protect etcd (client certificate authentication, only the API server talks to it) *and* to encrypt Secrets.
    - type: references
      links:
      - url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
        text: Encrypting Confidential Data at Rest
- title: Write the EncryptionConfiguration
  category: Encryption at Rest
  hintsEnabled: true
  elements:
  - type: context
    text: |
      Create `/etc/kubernetes/enc/enc.yaml` so that Secrets are encrypted with AES-CBC. You generated the key and have it in base64:
      `MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=`. Name the key `key1`.

      Existing Secrets are still stored in clear text and must remain readable while they are being re-encrypted.
  - type: question
    question:
      questionType: multiline
      header: Write the content of the file.
      hint: Providers are tried in order. The first one encrypts new writes; all of them can be used to read. Which provider
        must come first, and which must remain for old data?
      correctAnswerInfo: '`identity: {}` means "no encryption". Left second, it only serves to read old plaintext. If it were
        first, nothing would be encrypted at all.'
      expectedAnswer: |
        apiVersion: apiserver.config.k8s.io/v1
        kind: EncryptionConfiguration
        resources:
          - resources:
              - secrets
            providers:
              - aescbc:
                  keys:
                    - name: key1
                      secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
              - identity: {}
      cel: 'answer.contains(''kind: EncryptionConfiguration'') && answer.contains(''- secrets'') && answer.contains(''aescbc:'')
        && answer.contains(''name: key1'') && answer.contains(''secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='') &&
        answer.contains(''identity: {}'') && answer.indexOf(''aescbc'') < answer.indexOf(''identity'')'
  - type: question
    question:
      questionType: command
      header: The key has to be 32 random bytes encoded in base64. Generate such a key with `head` from the random device
        and base64.
      hint: Read exactly 32 bytes from the kernel random generator and encode them.
      correctAnswerInfo: '`head -c 32 /dev/urandom | base64`. AES-256 needs a 32-byte key; 16 and 24 bytes select AES-128
        and AES-192.'
      command:
        executable: head
        strictness: permissive
        positionals:
        - index: 0
          value: /dev/urandom
        flags:
        - name: bytes
          short: c
          required: true
          value: '32'
      modifiers:
      - type: Pipe
        pipe:
          command:
            executable: base64
            strictness: permissive
  explanation:
    elements:
    - type: context
      text: |
        Provider order is the central idea: **first = used for writing, any = usable for reading**. Other providers: `aesgcm` (fast, but
        nonce-reuse risk requires frequent rotation), `secretbox` (XSalsa20-Poly1305), `kms` v2 (key encryption key held outside the cluster, the
        recommended production choice), `identity` (plaintext).
    - type: references
      links:
      - url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
        text: Encrypting Confidential Data at Rest
- title: Enable It in the API Server
  category: Encryption at Rest
  hintsEnabled: true
  elements:
  - type: context
    text: |
      The configuration file is ready on the control-plane node. The API server runs as a static Pod from
      `/etc/kubernetes/manifests/kube-apiserver.yaml`.
  - type: question
    question:
      questionType: single-line
      header: Which kube-apiserver flag tells it where the encryption configuration is?
      hint: Encryption, provider, config.
      expectedAnswer: --encryption-provider-config
      cel: answer.trim().lowerAscii() in ["--encryption-provider-config", "encryption-provider-config"]
  - type: question
    question:
      questionType: single-line
      header: Which two Pod spec additions make the file visible inside the API server container? (name the parts)
      hint: Same pattern as for audit policy files and admission configuration.
      expectedAnswer: volume and volumeMount
      cel: answer.trim().lowerAscii() in ["volume and volumemount", "volumes and volumemounts", "volume, volumemount", "hostpath
        volume and volumemount", "volumemount and volume", "volume and volumemounts", "volumes and volumemounts", "hostpath
        volume and volume mount", "volume and volume mount"]
  - type: question
    question:
      questionType: single-line
      header: After saving the manifest, who restarts the API server?
      hint: Static Pods are managed by a node agent, not by a controller.
      correctAnswerInfo: The kubelet watches `/etc/kubernetes/manifests` and recreates the Pod when the file changes. Wait
        for `kubectl get nodes` to work again.
      expectedAnswer: kubelet
      cel: answer.trim().lowerAscii() in ["kubelet", "the kubelet"]
  - type: question
    question:
      questionType: single-line
      header: Which flag, added next to the config flag, lets the API server pick up edits of the encryption file without
        a restart?
      hint: 'The name says what it does: automatic reload.'
      expectedAnswer: --encryption-provider-config-automatic-reload
      cel: answer.trim().lowerAscii() in ["--encryption-provider-config-automatic-reload", "encryption-provider-config-automatic-reload"]
  explanation:
    elements:
    - type: context
      text: |
        A typo in the YAML or a missing mount stops the API server from starting; use `crictl ps -a` and `crictl logs` as in the earlier
        troubleshooting. Always keep a backup of the original manifest outside `/etc/kubernetes/manifests`.
    - type: references
      links:
      - url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
        text: Encrypting Confidential Data at Rest
- title: Verify It Works
  category: Encryption at Rest
  hintsEnabled: true
  elements:
  - type: context
    text: |
      The API server is back. Create a new Secret to test, then look at the stored bytes.
  - type: question
    question:
      questionType: command
      header: Create a generic Secret `enc-test` in namespace `default` with the literal `token=abc123`.
      hint: Imperative Secret creation with one literal.
      command:
        executable: kubectl
        subcommands:
        - name: create
        - name: secret
        - name: generic
        positionals:
        - index: 0
          value: enc-test
        flags:
        - name: from-literal
          required: true
          value: token=abc123
  - type: question
    question:
      questionType: command
      header: Read the stored value of that Secret from etcd and show it in hex and ASCII by piping through hexdump with the
        canonical flag.
      hint: The same etcd read as before, then pipe it into the hex viewer; the canonical format shows ASCII on the right.
      command:
        executable: etcdctl
        subcommands:
        - name: get
        positionals:
        - index: 0
          value: /registry/secrets/default/enc-test
        flags: *id001
      modifiers:
      - type: Pipe
        pipe:
          command:
            executable: hexdump
            strictness: permissive
            flags:
            - name: canonical
              short: C
              required: true
              boolean: true
  - type: manifest
    header: hexdump output (start)
    content: |
      00000000  2f 72 65 67 69 73 74 72  79 2f 73 65 63 72 65 74  |/registry/secret|
      00000010  73 2f 64 65 66 61 75 6c  74 2f 65 6e 63 2d 74 65  |s/default/enc-te|
      00000020  73 74 0a 6b 38 73 3a 65  6e 63 3a 61 65 73 63 62  |st.k8s:enc:aescb|
      00000030  63 3a 76 31 3a 6b 65 79  31 3a 8e 2f 1c d0 55 9a  |c:v1:key1:./..U.|
  - type: question
    question:
      questionType: single-line
      header: Which text in the value proves that the Secret is encrypted? Write the prefix up to and including the provider
        name and the key name, separated by colons, e.g. in the form k8s:enc:<provider>:v1:<key>.
      hint: Read it from the ASCII column and fill in the provider and key.
      expectedAnswer: k8s:enc:aescbc:v1:key1
      cel: answer.trim() in ["k8s:enc:aescbc:v1:key1"]
  - type: question
    question:
      questionType: command
      header: 'Does the API still return the plaintext to an authorized client? Print the decoded `token` of `enc-test`: get
        its `.data.token` with JSONPath and decode it.'
      hint: Encryption is invisible to API clients.
      command:
        executable: kubectl
        subcommands:
        - name: get
        - name: secret
          aliases:
          - secrets
        positionals:
        - index: 0
          value: enc-test
        flags:
        - name: output
          short: o
          required: true
          regex: ^jsonpath.*\.data\.token
      modifiers:
      - type: Pipe
        pipe:
          command:
            executable: base64
            strictness: permissive
            flags:
            - name: decode
              short: d
              required: true
              boolean: true
  explanation:
    elements:
    - type: context
      text: |
        The format on disk is `k8s:enc:<provider>:v1:<key name>:<ciphertext>`. If you instead see `k8s\x00` followed by readable text, the data is
        unencrypted. The `kubectl get secret` output never changes, because the API server decrypts for authorized callers.
    - type: references
      links:
      - url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
        text: Encrypting Confidential Data at Rest
- title: Encrypt the Secrets That Already Exist
  category: Encryption at Rest
  hintsEnabled: true
  elements:
  - type: context
    text: |
      `enc-test` is encrypted, but a check of `db-creds` in etcd still shows plaintext. The configuration only affects **writes**.
      You need every Secret in every namespace rewritten once without changing its content.
  - type: question
    question:
      questionType: command
      header: Read all Secrets of all namespaces as JSON and pipe them into a replace command that reads from standard input.
      hint: A read followed by a write of the same objects. The stdin marker is a dash.
      correctAnswerInfo: '`kubectl get secrets -A -o json | kubectl replace -f -`. Each object is written back and therefore
        encrypted with the first provider. If replace fails with a conflict because something wrote to an object in the meantime,
        simply run the command again.'
      command:
        executable: kubectl
        subcommands:
        - name: get
        - name: secrets
          aliases:
          - secret
        flags:
        - name: all-namespaces
          short: A
          required: true
          boolean: true
        - name: output
          short: o
          required: true
          value: json
      modifiers:
      - type: Pipe
        pipe:
          command:
            executable: kubectl
            subcommands:
            - name: replace
            flags:
            - name: filename
              short: f
              required: true
              value: '-'
  - type: question
    question:
      questionType: single-line
      header: Do you have to change any field of the Secrets for the rewrite to re-encrypt them? (yes/no)
      hint: Encryption is applied by the API server whenever it stores an object.
      correctAnswerInfo: The API server encrypts on every write with the first provider. A replace with unchanged content
        is still a write, so the stored bytes change.
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ["no"]
  explanation:
    elements:
    - type: context
      text: |
        For a very large number of Secrets you can run the same pipeline per namespace. Conflicts can occur when a Secret changes during the
        replace (resourceVersion mismatch); rerun for those. Afterwards check a few keys with `etcdctl` and `hexdump`.
    - type: references
      links:
      - url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
        text: Encrypting Confidential Data at Rest
- title: Rotate the Key
  category: Encryption at Rest
  hintsEnabled: true
  elements:
  - type: context
    text: |
      Policy requires rotating the encryption key. The current configuration has `key1` first in the `aescbc` provider list. Put these steps in the order that
      never leaves a Secret unreadable.
  - type: question
    question:
      questionType: ordering
      header: Order the key rotation steps for a cluster with several API servers.
      hint: A key must be readable on every API server before any of them uses it for writing, and must stay until nothing
        is encrypted with it.
      correctAnswerInfo: 'If key2 were first right away, the API servers restarted early would write with key2 while those
        not yet restarted cannot read it. Removing key1 before all Secrets are rewritten makes those Secrets unreadable: the
        API server returns errors for them and you must restore the key to recover. On a single control plane node the short
        form works, but this is the safe order.'
      items:
      - id: addsecond
        text: Add the new key key2 as the SECOND key of the aescbc provider, below key1
      - id: restart1
        text: Restart (or reload) ALL API servers so that every one of them can read key2
      - id: movefirst
        text: Move key2 to the FIRST position, above key1
      - id: restart2
        text: Restart (or reload) ALL API servers again so that they now write with key2
      - id: replace
        text: Rewrite all Secrets so they are stored with key2
      - id: remove
        text: Remove key1 from the configuration and restart/reload the API servers
      correctOrder:
      - addsecond
      - restart1
      - movefirst
      - restart2
      - replace
      - remove
  - type: question
    question:
      questionType: multiline
      header: Write the provider list (only the `providers` part with the `aescbc` and `identity` entries) after the step
        that makes `key2` the write key, with new key `key2` secret `bmV3LWtleS0zMi1ieXRlcy1sb25nLXJhbmRvbS0xMjM=` placed
        first.
      hint: 'Inside one provider the key list is ordered too: the first key encrypts.'
      expectedAnswer: |
        providers:
          - aescbc:
              keys:
                - name: key2
                  secret: bmV3LWtleS0zMi1ieXRlcy1sb25nLXJhbmRvbS0xMjM=
                - name: key1
                  secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          - identity: {}
      cel: 'answer.contains(''name: key2'') && answer.contains(''name: key1'') && answer.indexOf(''name: key2'') < answer.indexOf(''name:
        key1'') && answer.contains(''identity'') && answer.contains(''bmV3LWtleS0zMi1ieXRlcy1sb25nLXJhbmRvbS0xMjM='') && answer.contains(''MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='')'
  explanation:
    elements:
    - type: context
      text: |
        Two orderings matter: providers (first encrypts) and keys inside a provider (first encrypts). The rotation order is always:
        **add new as second → restart all API servers → move it first → restart all again → rewrite data → remove old**. In a highly available control plane the two
        restarts are what make the order safe.
    - type: references
      links:
      - url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
        text: Encrypting Confidential Data at Rest
- title: Turning Encryption Off and Choosing Providers
  category: Encryption at Rest
  hintsEnabled: true
  elements:
  - type: context
    text: |
      To decrypt all Secrets (for example before migrating to a KMS plugin), you need the API server to **write** in plain text while still
      being able to **read** the encrypted ones.
  - type: question
    question:
      questionType: multiline
      header: Write the `providers` list that stops encrypting new writes but can still read data encrypted with key1 (secret
        value `MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=`).
      hint: Who is first decides how new data is written.
      expectedAnswer: |
        providers:
          - identity: {}
          - aescbc:
              keys:
                - name: key1
                  secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      cel: 'answer.contains(''identity'') && answer.contains(''aescbc'') && answer.contains(''name: key1'') && answer.indexOf(''identity'')
        < answer.indexOf(''aescbc'')'
  - type: question
    question:
      questionType: single-line
      header: After the API server runs with this configuration, existing Secrets are still stored encrypted. What must you
        do to decrypt them on disk?
      hint: Remember how the original Secrets got encrypted.
      correctAnswerInfo: Moving `identity` first only changes how new writes are stored. Run the same `kubectl get secrets
        -A -o json | kubectl replace -f -` again, and only then remove the encryption provider from the configuration.
      expectedAnswer: rewrite all Secrets
      cel: answer.lowerAscii().contains('rewrit') || answer.lowerAscii().contains('replace') || answer.lowerAscii().contains('write
        them') || answer.lowerAscii().contains('written again')
  - type: question
    question:
      questionType: multiline
      header: Another team prefers `secretbox` over `aescbc`. Write the `providers` list with `secretbox` (key `key1`, secret
        value `MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=`) first and identity second.
      hint: 'Same shape as aescbc: a provider with a keys list.'
      expectedAnswer: |
        providers:
          - secretbox:
              keys:
                - name: key1
                  secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          - identity: {}
      cel: 'answer.contains(''secretbox:'') && answer.contains(''name: key1'') && answer.contains(''MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='')
        && answer.contains(''identity'') && answer.indexOf(''secretbox'') < answer.indexOf(''identity'') && !answer.contains(''aescbc'')'
  - type: question
    question:
      questionType: single-line
      header: Which resource entry encrypts all resources, including custom resources, with one provider list (Kubernetes
        1.27 and later)?
      hint: Two wildcards with a dot between them, written as group.resource.
      expectedAnswer: '*.*'
      cel: answer.trim() in ["*.*", "\"*.*\"", "'*.*'", "- \"*.*\"", "- *.*"]
  - type: question
    question:
      questionType: single-line
      header: Which provider keeps the key outside the cluster in an external key management service and is recommended for
        production?
      hint: Three letters.
      expectedAnswer: kms
      cel: answer.trim().lowerAscii() in ["kms", "kms v2", "kmsv2", "kms provider"]
  - type: question
    question:
      questionType: single-line
      header: Does encryption at rest protect a Secret from a user who has `get` on secrets in RBAC? (yes/no)
      hint: Who sees the plaintext, the API server or etcd?
      correctAnswerInfo: It protects data on disk and in backups. API users with the right to read the object still get plaintext.
      expectedAnswer: 'no'
      cel: answer.trim().lowerAscii() in ["no"]
  explanation:
    elements:
    - type: context
      text: |
        The Kubernetes documentation now discourages `aescbc` (it is vulnerable to padding-oracle attacks) and prefers `kms` v2, or `secretbox`/`aesgcm` with regular rotation. Exam tasks still often use `aescbc`, so you must be able to write all of them.

        Where encryption at rest helps: stolen disks, etcd snapshots, backup leaks, direct etcd access. Where it does not: a user with RBAC permission to
        read Secrets, a compromised API server, and Pods that mount the Secret.
    - type: references
      links:
      - url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
        text: Encrypting Confidential Data at Rest
      - url: https://kubernetes.io/docs/tasks/administer-cluster/kms-provider/
        text: Using a KMS provider for data encryption
- title: 'Capstone: Protect the Secrets of the Cluster'
  category: Capstone
  hintsEnabled: true
  elements:
  - type: context
    text: |
      Final task: Secrets must be encrypted at rest with AES-CBC using key `prod1` (use the base64 key `MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=`), the existing Secrets must be
      re-encrypted, and the result must be verified for the Secret `payments-key` in namespace `payments`.

      First the configuration file `/etc/kubernetes/enc/prod.yaml`.
  - type: question
    question:
      questionType: multiline
      header: Write the configuration for Secrets and ConfigMaps (both resources in one entry).
      hint: One `resources` entry can list several resource names.
      expectedAnswer: |
        apiVersion: apiserver.config.k8s.io/v1
        kind: EncryptionConfiguration
        resources:
          - resources:
              - secrets
              - configmaps
            providers:
              - aescbc:
                  keys:
                    - name: prod1
                      secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
              - identity: {}
      cel: 'answer.contains(''kind: EncryptionConfiguration'') && answer.contains(''- secrets'') && answer.contains(''- configmaps'')
        && answer.contains(''name: prod1'') && answer.contains(''MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='') && answer.indexOf(''aescbc'')
        < answer.indexOf(''identity'')'
  - type: question
    question:
      questionType: single-line
      header: Which flag in the kube-apiserver manifest points to this file?
      hint: Encryption provider config.
      expectedAnswer: --encryption-provider-config
      cel: answer.trim().lowerAscii() in ["--encryption-provider-config", "encryption-provider-config"]
  - type: question
    question:
      questionType: single-line
      header: Which two additions to the static Pod manifest make the file visible inside the container? (name the parts)
      hint: Without them the API server cannot start.
      expectedAnswer: volume and volumeMount
      cel: answer.trim().lowerAscii() in ["volume and volumemount", "volumes and volumemounts", "volume, volumemount", "hostpath
        volume and volumemount", "volumemount and volume", "volume and volumemounts", "hostpath volume and volume mount",
        "volume and volume mount", "volumemounts and volumes", "volumes and volumemount"]
  - type: question
    question:
      questionType: command
      header: 'After the restart, rewrite all Secrets: pipe the JSON of all Secrets in all namespaces into replace.'
      hint: The stored data is changed by writing it back.
      command:
        executable: kubectl
        subcommands:
        - name: get
        - name: secrets
          aliases:
          - secret
        flags:
        - name: all-namespaces
          short: A
          required: true
          boolean: true
        - name: output
          short: o
          required: true
          value: json
      modifiers:
      - type: Pipe
        pipe:
          command:
            executable: kubectl
            subcommands:
            - name: replace
            flags:
            - name: filename
              short: f
              required: true
              value: '-'
  - type: question
    question:
      questionType: command
      header: 'The configuration also covers ConfigMaps, so rewrite those as well: the same pipeline for all ConfigMaps of
        all namespaces.'
      hint: Every resource named in the configuration must be rewritten.
      command:
        executable: kubectl
        subcommands:
        - name: get
        - name: configmaps
          aliases:
          - configmap
          - cm
        flags:
        - name: all-namespaces
          short: A
          required: true
          boolean: true
        - name: output
          short: o
          required: true
          value: json
      modifiers:
      - type: Pipe
        pipe:
          command:
            executable: kubectl
            subcommands:
            - name: replace
            flags:
            - name: filename
              short: f
              required: true
              value: '-'
  - type: question
    question:
      questionType: command
      header: 'Verify: read `payments-key` of namespace `payments` from etcd and show it with hexdump -C.'
      hint: The etcd key path follows /registry/<resource>/<namespace>/<name>.
      command:
        executable: etcdctl
        subcommands:
        - name: get
        positionals:
        - index: 0
          value: /registry/secrets/payments/payments-key
        flags: *id001
      modifiers:
      - type: Pipe
        pipe:
          command:
            executable: hexdump
            strictness: permissive
            flags:
            - name: canonical
              short: C
              required: true
              boolean: true
  explanation:
    elements:
    - type: context
      text: |
        Complete workflow: config file → flag, volume and mount in the static Pod → wait for the API server → rewrite existing objects →
        verify with `etcdctl | hexdump`. Remember RBAC: encryption at rest does not replace least-privilege access to Secrets.
    - type: references
      links:
      - url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
        text: Encrypting Confidential Data at Rest
