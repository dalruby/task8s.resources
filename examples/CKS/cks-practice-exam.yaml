            - kube-apiserver
            - --advertise-address=192.168.100.11
            - --allow-privileged=true
            - --anonymous-auth=true
            - --authorization-mode=AlwaysAllow
            - --client-ca-file=/etc/kubernetes/pki/ca.crt
            - --enable-admission-plugins=AlwaysAdmit
            - --enable-bootstrap-token-auth=true
            - --etcd-cafile=/etc/kubernetes/pki/etcd/ca.crt
            - --etcd-certfile=/etc/kubernetes/pki/apiserver-etcd-client.crt
            - --etcd-keyfile=/etc/kubernetes/pki/apiserver-etcd-client.key
            - --etcd-servers=https://127.0.0.1:2379
            - --kubelet-client-certificate=/etc/kubernetes/pki/apiserver-kubelet-client.crt
            - --kubelet-client-key=/etc/kubernetes/pki/apiserver-kubelet-client.key
            - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
            - --proxy-client-cert-file=/etc/kubernetes/pki/front-proxy-client.crt
            - --proxy-client-key-file=/etc/kubernetes/pki/front-proxy-client.key
            - --requestheader-allowed-names=front-proxy-client
            - --requestheader-client-ca-file=/etc/kubernetes/pki/front-proxy-ca.crt
            - --requestheader-extra-headers-prefix=X-Remote-Extra-
            - --requestheader-group-headers=X-Remote-Group
            - --requestheader-username-headers=X-Remote-User
            - --secure-port=6443
            - --service-account-issuer=https://kubernetes.default.svc.cluster.local
            - --service-account-key-file=/etc/kubernetes/pki/sa.pub
            - --service-account-signing-key-file=/etc/kubernetes/pki/sa.key
            - --service-cluster-ip-range=10.96.0.0/12
            - --tls-cert-file=/etc/kubernetes/pki/apiserver.crt
            - --tls-private-key-file=/etc/kubernetes/pki/apiserver.key
            image: registry.k8s.io/kube-apiserver:v1.34.2
            imagePullPolicy: IfNotPresent
            livenessProbe:
              failureThreshold: 8
              httpGet:
                host: 192.168.100.11
                path: /livez
                port: 6443
                scheme: HTTPS
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 15
            name: kube-apiserver
            resources:
              requests:
                cpu: 250m
            volumeMounts:
            - mountPath: /etc/ssl/certs
              name: ca-certs
              readOnly: true
            - mountPath: /etc/ca-certificates
              name: etc-ca-certificates
              readOnly: true
            - mountPath: /etc/kubernetes/pki
              name: k8s-certs
              readOnly: true
            - mountPath: /usr/local/share/ca-certificates
              name: usr-local-share-ca-certificates
              readOnly: true
            - mountPath: /usr/share/ca-certificates
              name: usr-share-ca-certificates
              readOnly: true
          hostNetwork: true
          priority: 2000001000
          priorityClassName: system-node-critical
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - hostPath:
              path: /etc/ssl/certs
              type: DirectoryOrCreate
            name: ca-certs
          - hostPath:
              path: /etc/ca-certificates
              type: DirectoryOrCreate
            name: etc-ca-certificates
          - hostPath:
              path: /etc/kubernetes/pki
              type: DirectoryOrCreate
            name: k8s-certs
          - hostPath:
              path: /usr/local/share/ca-certificates
              type: DirectoryOrCreate
            name: usr-local-share-ca-certificates
          - hostPath:
              path: /usr/share/ca-certificates
              type: DirectoryOrCreate
            name: usr-share-ca-certificates
      cel:
      - name: No anonymous
        expression: manifest.spec.containers[0].command.exists(a, a == '--anonymous-auth=false') && manifest.spec.containers[0].command.all(a,
          !a.startsWith('--anonymous-auth=') || a == '--anonymous-auth=false')
        message: --anonymous-auth must be false
      - name: Node and RBAC
        expression: manifest.spec.containers[0].command.exists(a, a == '--authorization-mode=Node,RBAC' || a == '--authorization-mode=RBAC,Node')
          && manifest.spec.containers[0].command.all(a, !a.startsWith('--authorization-mode=') || a == '--authorization-mode=Node,RBAC'
          || a == '--authorization-mode=RBAC,Node')
        message: --authorization-mode must be Node,RBAC
      - name: NodeRestriction
        expression: manifest.spec.containers[0].command.exists(a, a.startsWith('--enable-admission-plugins=') && 'NodeRestriction'
          in a.substring(27).split(',')) && manifest.spec.containers[0].command.all(a, !a.startsWith('--enable-admission-plugins=')
          || !('AlwaysAdmit' in a.substring(27).split(',')))
        message: Enable NodeRestriction and remove AlwaysAdmit
  - type: question
    question:
      questionType: command
      header: 'After the API server is back, check that an anonymous request is rejected: list the namespaces as the anonymous
        user through impersonation.'
      correctAnswerInfo: With anonymous access disabled, real anonymous requests get 401 Unauthorized; impersonation shows
        the RBAC answer (403).
      command:
        executable: kubectl
        subcommands:
        - name: get
        - name: namespaces
          aliases:
          - namespace
          - ns
        flags:
        - name: as
          required: true
          value: system:anonymous
  explanation:
    elements:
    - type: context
      text: 'Order the authorizers `Node,RBAC`: Node handles kubelet requests first. If the API server does not restart, compare
        the manifest with a backup and read `crictl logs` of the exited container.'
    - type: references
      links:
      - url: https://kubernetes.io/docs/reference/access-authn-authz/authentication/#anonymous-requests
        text: Anonymous requests
      - url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/#noderestriction
        text: NodeRestriction
