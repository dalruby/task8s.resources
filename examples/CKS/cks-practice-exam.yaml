        type: string
      kind:
        type: string
      metadata:
        type: object
      omitStages:
        type: array
        items:
          enum:
          - RequestReceived
          - ResponseStarted
          - ResponseComplete
          - Panic
      omitManagedFields:
        type: boolean
      rules:
        type: array
        minItems: 1
        items:
          type: object
          required:
          - level
          additionalProperties: false
          properties:
            level:
              enum:
              - None
              - Metadata
              - Request
              - RequestResponse
            users:
              type: array
              items:
                type: string
            userGroups:
              type: array
              items:
                type: string
            verbs:
              type: array
              items:
                type: string
            namespaces:
              type: array
              items:
                type: string
            nonResourceURLs:
              type: array
              items:
                type: string
            resources:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  group:
                    type: string
                  resources:
                    type: array
                    items:
                      type: string
                  resourceNames:
                    type: array
                    items:
                      type: string
            omitStages:
              type: array
              items:
                enum:
                - RequestReceived
                - ResponseStarted
                - ResponseComplete
                - Panic
