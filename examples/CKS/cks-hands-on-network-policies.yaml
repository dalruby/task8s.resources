apiVersion: v1alpha1
name: 'CKS (Hands-On): Network Policies'
k8sVersion: 1.34.0
timing:
  enabled: true
  limitSeconds: 7200
introduction:
  elements:
  - type: context
    text: |
      Hands-on practice for **NetworkPolicies**, the CKS tool for restricting traffic inside the cluster
      (cluster setup) and for containing a compromised workload (runtime security). There is no multiple
      choice: you write policies, read them, predict which connections succeed and test the result.

      **Lab environment**

      - You are `root` on the control-plane node of a kubeadm cluster (Kubernetes 1.34, containerd) with a
        CNI plugin that **enforces** NetworkPolicies (Calico), unless a scenario says otherwise. `kubectl`
        works and the namespaces mentioned in a scenario exist.
      - Most scenarios use a small shop: the namespace `shop` with `web`, `api` and `db` workloads, plus
        `prod`, `monitoring` and `ingress-nginx` where a task needs another namespace.
      - Test containers have `wget`, `nc` and `nslookup`.

      **How answers are checked**

      - *Policies* are validated as `NetworkPolicy` objects against the Kubernetes schema (so a misspelt
        field is reported) and then for what they *mean*: selectors, directions, peers and ports. Names and
        field order do not matter.
      - *Commands* are checked structurally. *Short answers* accept the common spellings.
      - Question text states what is wanted, not which fields to use.

      Exam content is under NDA: this is practice for the common patterns, not a prediction.
  - type: references
    links:
    - url: https://kubernetes.io/docs/concepts/services-networking/network-policies/
      text: Network Policies
    - url: https://kubernetes.io/docs/tasks/administer-cluster/declare-network-policy/
      text: Declare Network Policy
    - url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
      text: Debug Services
    - url: https://docs.cilium.io/en/stable/security/policy/
      text: 'Cilium: Network Policy'
    - url: https://training.linuxfoundation.org/certification/certified-kubernetes-security-specialist-cks/
      text: CKS Domains and Competencies
