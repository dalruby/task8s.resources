- title: 'Capstone: Harden a Whole Dockerfile'
  category: Capstone
  hintsEnabled: true
  elements:
  - type: context
    text: |
      The following Dockerfile for a Node.js API was written in a hurry. Harden it completely:

      - build stage (named `build`) based on `node:20` that installs dependencies and builds the app,
      - final stage on a pinned `node:20-alpine` image that copies only the built result (`/app/dist`) from the build stage,
      - non-root user with a numeric ID, and
      - no secrets or package manager leftovers.
  - type: manifest
    header: Dockerfile to harden
    content: |
      FROM node:latest
      WORKDIR /app
      COPY . .
      ENV DB_PASSWORD=hunter2
      RUN npm install
      RUN npm run build
      EXPOSE 3000
      CMD npm start
  - type: question
    question:
      questionType: dockerfile
      header: Write the hardened Dockerfile.
      hint: 'Combine the earlier lessons: stages, pinned tags, the exec form for CMD, USER with a number.'
      correctAnswerInfo: A possible solution has two FROM lines, `USER 10001` before CMD, `COPY --from=build /app/dist ./dist`,
        and a start command like CMD ["node", "dist/server.js"].
      initialContent: |
        FROM node:latest
        WORKDIR /app
        COPY . .
        ENV DB_PASSWORD=hunter2
        RUN npm install
        RUN npm run build
        EXPOSE 3000
        CMD npm start
      expected:
      - stage: build
        from:
          image: node
          tag: '20'
        instructions:
        - instruction: RUN
          contains: npm
      - from:
          image: node
          tag: 20-alpine
        instructions:
        - instruction: COPY
          flags:
            from: build
      cel:
      - *id001
      - name: Pinned base images
        expression: dockerfile.stages.all(s, s.from.image == 'scratch' || s.from.digest != '' || (s.from.tag != '' && s.from.tag
          != 'latest') || dockerfile.stages.exists(o, o.name != '' && o.name == s.from.image))
        message: Every base image must be pinned to a specific version
      - name: No secrets
        expression: '!dockerfile.stages.exists(s, s.instructions.exists(i, (i.name == ''ENV'' || i.name == ''ARG'') && i.values.exists(k,
          k.upperAscii().contains(''PASSWORD'') || k.upperAscii().contains(''SECRET'') || k.upperAscii().contains(''TOKEN''))))'
        message: Credentials must not be part of the image
      - name: Dist copied
        expression: dockerfile.stages[1].instructions.exists(i, i.name == 'COPY' && i.flags.exists(k, k == 'from') && i.text.contains('/app/dist'))
        message: The final stage must contain the build output
      - name: Exec form start
        expression: dockerfile.stages[1].instructions.exists(i, (i.name == 'CMD' || i.name == 'ENTRYPOINT') && i.form == 'exec')
        message: Start the app so that it receives signals directly
  explanation:
    elements:
    - type: context
      text: |
        The hardening checklist you applied: pinned base (tag or digest), multi-stage, minimal runtime image, numeric non-root user,
        no secrets or ADD, exec-form start command. Next steps in a real pipeline: scan the result with Trivy, then enforce at admission
        that only images from your registry (by digest) run.
    - type: references
      links:
      - url: https://docs.docker.com/build/building/best-practices/
        text: 'Docker: Building best practices'
      - url: https://docs.docker.com/build/building/multi-stage/
        text: 'Docker: Multi-stage builds'
